    <div class="grid" style="margin-top:10px">${cell('Peak',fmt.n(L.peak),[`minute ${L.series.indexOf(L.peak)}`])}${cell('Average',fmt.n(L.avg),['across the stream'])}${cell('Engaged views since',fmt.n(mm.engaged),['the replay'])}${cell('Subscribers gained',mm.subsGained,['during and after'])}</div>
    ${readN(`Peaked at ${fmt.n(L.peak)} in minute ${L.series.indexOf(L.peak)} and held ${fmt.n(L.avg)} on average. Viewers fall away after minute ${Math.round(L.mins*0.8)} — that's where the Q&A went quiet. End on the announcement, not the goodbye.`)}
    ${explain('live','Minute-by-minute concurrent viewers during the stream, and the replay afterwards.','A brand buying a live segment is buying concurrents × duration, not the replay.','Put the segment that matters where the curve is highest, not at the start.')}</section>
   <section class="block">${titleRow('Reception',KM.src('yt'))}<div class="grid">${cell('Likes',fmt.n(mm.likes))}${cell('Dislikes',mm.dislikes,['visible only to you · never in Momentum'])}</div></section>`}
 else {
  const vir=p.viral||p.soFar;

  body=`<section class="hero"><h2 style="font-size:19px;line-height:1.25">${p.title}</h2>

    <div class="momentum" style="margin-top:12px"><div class="num" style="font-size:56px">${vir?fmt.x(vir.v):'—'}</div><div class="lbl"><b>Viral score${KM.kmark('Viral score')}</b><span>${virLbl}</span></div></div>

    ${p.backfilled?banner('Lifetime figure — this post is older than your connection, so no day-7 snapshot was ever captured. Marked, not hidden.','amber'):p.mature?'':banner(`So far — these numbers freeze on day 7, ${fmt.date(daysAgo(p.age-7))}.`,'info')}</section>
   <section class="block">${titleRow(p.pf==='yt'?'All views since posting':'Views since posting',KM.src(p.pf))}

    <div class="legend"><span><i class="acc"></i>this ${TYPEL[p.type].toLowerCase()}${p.pf==='yt'?', all views':''}</span><span><i class="dash"></i>your typical${p.pf==='yt'?', all views':''}</span></div>
    <div class="hint">${p.pf==='yt'?`YouTube has counted a view from the first frame since August 2026. This chart and the pace use those all-views counts (${fmt.n(mm.views)}${p.mature?' at day 7':' so far'}); engaged views, the plays that continued, are ${fmt.n(mm.engaged)}.`:'Instagram labels views "in development" and reach "estimated". We use them as reported and say so.'}</div></section>
   ${p.type!=='feed'?`<section class="block">${titleRow('First 48 hours',`${KM.srcK()}${expandBtn('like_velocity')}`)}${velocity(p.hourly,typHourly,Math.min(48,p.age*24))}
     <div class="grid" style="margin-top:10px">${cell('First hour',fmt.n(p.hourly[1]),[typHourly?`typical ${fmt.n(typHourly[1])}`:'first snapshot at 45 min'])}${cell('First 24 hours',fmt.n(p.hourly[24]),[typHourly?`typical ${fmt.n(typHourly[24])}`:''])}</div>
     <div class="hint">Interaction velocity from hourly snapshots — views, likes and comments, plus saves and shares where the platform reports them live.</div></section>`:''}`;
  if(p.pf==='yt'){const b=F.bounce(mm);

   <section class="block">${titleRow('Hook',KM.srcK())}

    ${readN(b>x.bounce*1.25?`${fmt.pct(b,0)} of plays stopped at the very first frame — half again your usual. With a click rate this strong, the opening seconds aren't matching what the thumbnail promised.`:`${fmt.pct(b,0)} of plays stopped at the first frame, in line with your usual. The hook held.`,b>x.bounce*1.25?'warn':'')}

   if(p.type==='long')body+=`<section class="block">${titleRow('Retention',`${KM.src('yt')}${expandBtn('watch')}`)}${retention(p.retention,p.relRet)}
    <div class="legend"><span><i class="acc"></i>still watching</span><span><i class="dash"></i>YouTube: videos of similar length</span></div>
    <div class="grid" style="margin-top:10px">${cell('Average watched',fmt.pct(mm.watchPct,0),[`typical ${fmt.pct(x.watch,0)}`,mm.watchPct>=x.watch?'up':'down'])}${cell('Average view duration',Math.floor(mm.avgDur/60)+':'+String(mm.avgDur%60).padStart(2,'0'),['of '+Math.floor(p.dur/60)+' min'])}</div>

   <section class="block">${titleRow('Who watched',KM.src('yt'))}

  }

const REASON={"s":["<i>Where:</i> Home hero; Momentum screen · <i>Source:</i> KiMet metric (K) · <i>Audience:</i> creator · <i>existing</i>","One number from 1 to 100: the average of where you stand in your cohort on growth and engagement, plus your consistency score. Your cohort is creators in your category and size band.","74 means that, averaged across the three inputs, you sit around the 74th percentile of creators like you. The Momentum screen prints the three inputs, so \"74\" is literally \"96 on growth, 88 on engagement, 38 on consistency\".","Look at which input is dragging it down, not at the total. The lowest input is the week's job.","Answering \"how am I doing against people like me?\" in one look, every day.","Raw follower counts reward size; Momentum is rate-based, so a 5K account and a 50K account are judged the same way. It tells you whether your trajectory is strong for your size.","It does not measure quality or audience love. If your whole cohort grows, your Momentum does not move — it is relative by design. It needs a cohort of 25 creators; before that, you see your three inputs against your own last four weeks instead (A18). It is private unless you choose otherwise.","What it is","How to read it","How to use it","What it's for","Why it matters","Why this instead of what you do today","*(not shown in the app)*","Today a creator compares themselves with whoever they happen to see, usually much bigger accounts. Momentum compares you with a defined, consented group of creators your size, and shows the working.","What it doesn't do","<i>Where:</i> every post row; post detail · <i>Source:</i> KiMet metric (K) · <i>Audience:</i> creator · <i>existing</i>","How a post did against your own typical post of the same type on the same platform, at the same age: its day-7 views (engaged views on YouTube) divided by the median of your other same-type posts.","1.0× is your normal. 2.4× is a breakout for you; 0.6× is a weak one. Before day 7 it is labelled \"so far\" and compared with your posts at the same age.","Sort your posts by it to see what actually beat your normal, then open the format and topic of the winners.","Deciding what to make more of.","A 12K-view post is a flop for one account and a breakout for another. Judging each post against your own normal is the only fair way to compare your posts with each other.","It does not explain <i>why</i> a post did well; it does not compare you with other creators (that is Benchmarks); and it needs at least 12 same-type posts — below that it falls back to all your posts on that platform, labelled, with a minimum of 5.","Raw view counts make every recent post look weak (it is still accruing) and every big-account post look strong. This score compares like with like: same type, same age, your own baseline, excluding the post itself.","<i>Where:</i> under every chart and hero; the three-sentence digest on Home · <i>Source:</i> KiMet · <i>Audience:</i> creator · <i>existing</i>","A plain sentence that reads your number: what happened, what it means, and — only when the inference is sound — what to do.","The serif sentence is interpretation; the number above it is data. Bad news is stated first when it is the most important thing.","Read the Home digest (working / slipping / do this week) in under thirty seconds; open a chart only when a sentence makes you want to.","Turning numbers into a decision without needing to be an analyst.","Most creators do not use analytics dashboards because charts do not tell them what to do. The reading is the part that does.","The language model writes phrasing only; it never calculates, rounds or infers a figure. When the inference is weak, the reading says only what happened. A format lift is correlation, and the reading says \"if the pattern holds\".","Today the interpretation is left to the creator. Here every chart comes with its reading, and every figure in the sentence is computed, never guessed.","<i>Where:</i> Growth › Benchmarks; cohort lines across the app; the kit card · <i>Source:</i> KiMet metric (K) · <i>Audience:</i> creator; brand (on the kit) · <i>existing</i>","Your metrics placed against the median of consented creators in your category and size band, as a percentile.","\"Top 20% of tech creators this size\" means 80% of the cohort sit below you on that metric. \"Rank 8 of 31\" is used when the cohort is too small for a percentage to be honest.","Find the metric where you are furthest below your cohort; that is the most improvable thing.","Knowing whether a number is good.","\"6.1% engagement\" means nothing alone; \"well above the 3.8% median for accounts your size\" is a finding.","It needs 25 creators in a pool before it shows anything; it widens the pool (and says which pools were tried) rather than fake a rank. It does not detect fraud. It is anonymised — no one sees another creator's numbers. You can opt out of benchmarking; that also hides the cohort from you.","Read reach and engagement in the context of creators this size, not against the biggest names.","Knowing whether a creator is strong <i>for their size</i>.","A screenshot shows a number with no context and no proof. This percentile is computed from consented data read from the platforms, across creators of the same size and category.","<b>Creator:</b> find the metric where you are furthest below your cohort; that is the most improvable thing. <b>Brand:</b> read reach and engagement in the context of creators this size, not against the biggest names.","<b>Creator:</b> knowing whether a number is good. <b>Brand:</b> knowing whether a creator is strong <i>for their size</i>.","Why this instead of …","<b>Brand — why this instead of a screenshot:</b> a screenshot shows a number with no context and no proof. This percentile is computed from consented data read from the platforms, across creators of the same size and category. <i>(Creator version, not shown in the app: the platform's own analytics show your numbers alone; this shows them against people like you.)</i>","<i>Where:</i> Momentum input; Benchmarks; the kit's reliability grid · <i>Source:</i> KiMet metric (K) · <i>Audience:</i> creator; brand (on the kit) · <i>existing</i>","A 0–1 score: half for showing up each week over the last 12 weeks, half for posting at your cohort's usual pace, capped there.","1.0 means you posted every week at your cohort's norm. It is a standard to meet, not a race — you cannot be \"more consistent\" than always showing up at your cohort's pace.","If it is low, the fix is a steadier schedule, not more posts in a burst.","Building a rhythm.","Reliability is what brands pay for, and what an audience comes back for.","It does not reward volume — posting twenty times a day does not beat the cohort's norm. One holiday does not tank it. It needs four weeks of history.","Judging \"will they deliver the third post?\"","A screenshot shows one good post; this shows twelve weeks of verified posting behaviour.","<b>Creator:</b> building a rhythm. <b>Brand:</b> judging \"will they deliver the third post?\"","<b>Brand — why this instead of a screenshot:</b> a screenshot shows one good post; this shows twelve weeks of verified posting behaviour.","<i>Where:</i> Content › Formats · <i>Source:</i> KiMet (tags by a language model; creator-correctable) · <i>Audience:</i> creator; brand (kit: \"what each format delivers\") · <i>existing</i>","Every post tagged by format (talking head, skit, tutorial, trend audio, vlog…) and the formats ranked by <i>your</i> median performance.","\"Tutorials: 1.6× your median\" means your tutorials typically do 60% better than your average post.","Make more of the formats that beat your median; fix a wrong tag in one tap and the tagger learns from it.","Deciding what to make next; for a brand, deciding what to ask for.","Generic advice about \"what works\" ignores your audience. This is what works for yours.","It shows correlation, not cause. Only captions and titles are sent to the tagger — never your metrics.","Today this is a gut feeling or a hand-made spreadsheet. Here every post is tagged once and ranked automatically.","<i>Where:</i> Growth (the second module); Home \"needs attention\" · <i>Source:</i> from the platform, with a KiMet reading · <i>Audience:</i> creator · <i>existing</i>","The trends most tools hide, shown as prominently as the good ones — for example, reach per post falling while followers rise.","\"Reach per post has fallen four weeks running while followers rose\" means new followers are not seeing your posts.","Treat it as the most important line on the screen when it appears.","Catching a decline while it is still cheap to fix.","A dashboard that only celebrates teaches nothing.","It does not diagnose the cause for you; it says what happened.","A follower count going up can hide a reach problem for months. This puts the two side by side.","<i>Where:</i> Growth › Discovery · <i>Source:</i> from the platform · <i>Audience:</i> creator · <i>existing</i>","Your own traffic sources over time: search, suggested, browse, external; your top search terms; the channels you appear beside; and on Instagram, the follower / non-follower split and profile visits.","A rising \"suggested\" share means the platform is recommending you to new people.","Title for the search terms you already rank on; study the channels you appear next to.","Understanding how new people find you.","Growth comes from reaching people who do not follow you yet.","It shows only what each platform reports; Threads reports less.","The same data exists, scattered; here it is one screen, over time, per platform.","<i>Where:</i> Growth › Reception · <i>Source:</i> from the platform · <i>Audience:</i> creator only · <i>existing</i>","How audiences reacted: the dislike ratio on YouTube (visible only to you), and skip-rate over time on Instagram. Threads has no equivalent, and the screen says so.","A rising dislike ratio on one topic is a signal about that topic, not about you.","Compare reception across formats and topics.","Spotting what your audience does not want, privately.","The public no longer sees dislikes; you still can, and it is useful.","It is never shown to anyone else. Skip rate is unavailable on low-view Reels (Instagram does not report it), shown as unavailable, never as zero.","It turns scattered per-video figures into a trend.","<i>Where:</i> post detail; Home while a post is live · <i>Source:</i> KiMet reading of platform data · <i>Audience:</i> creator · <i>existing</i>","How fast a new post is picking up compared with your typical post in its first hour and first 24 hours.","\"Ahead of your usual pace\" in the first hour is an early signal of a breakout.","Check it in the first hours; share or reply while it matters.","Acting while a post is still moving.","The first hours decide much of a post's reach.","It is an early signal, not a prediction; the day-7 viral score is the real verdict.","Refreshing a like count tells you nothing without your normal to compare it with.","<i>Where:</i> Audience › Fans; the shareable card · <i>Source:</i> KiMet, from platform data · <i>Audience:</i> creator (the card is for the creator's audience) · <i>existing</i>","Your top supporters, ranked by how many of your posts they engaged with — loyalty, not volume — with a shareable top-ten card and a three-person shoutout card.","Someone on 38 of your last 50 posts ranks above someone who left 200 comments on one.","Thank them; share the card (handles or initials, your choice).","Recognising the people who show up.","Recognition builds community, and a card your audience wants to share spreads your account.","It celebrates; it offers no prizes. Quotes count more than reposts on Threads, because someone wrote about you.","Today this is guessed from memory; here it is counted.","<i>Where:</i> Home, on the 1st of the month; share sheet · <i>Source:</i> KiMet · <i>Audience:</i> creator · <i>existing</i>","A shareable summary of your month, sized for a story.","Your month's headline numbers, with Momentum if you leave it on.","Share it, or keep it.","Marking progress.","It is the object creators share, which is how others hear about KiMet.","It shows only what you choose to include.","No screenshot collage needed.","<i>Where:</i> any ⤢ on a chart · <i>Source:</i> KiMet · <i>Audience:</i> creator · <i>existing</i>","Any chart opened full-screen with ranges, a table view, daily change, its inputs, a statistics block, its reading, and an assistant scoped to that chart.","The statistics block states the figures; the assistant answers questions about this chart.","Ask \"why did this dip in week 3?\" and get an answer grounded in the chart's own numbers.","Going deep only when you want to.","Depth by pull, not push: Home stays calm, depth is one tap away.","The assistant does not invent numbers; it works from the chart's own data.","Today the answer means exporting to a spreadsheet.","<i>Where:</i> Home, Settings, the formula sheet · <i>Source:</i> KiMet · <i>Audience:</i> creator · <i>existing</i>","One screen listing every metric in the product (fifty), grouped, each with a one-sentence definition, which platforms report it, where it lives, and whether it opens as a chart.","A faded platform dot means that platform does not report the metric — nothing is invented to fill it.","Search for the thing you half-remember; see what connecting a second platform would add.","Finding anything, and deciding what to connect.","A hundred numbers with no address are a hundred numbers nobody finds.","It lists metrics; it does not add any the platforms do not provide.","It separates \"ours\" (K-marked) from \"the platform's\" in one place.","<i>Where:</i> Growth › Value · <i>Source:</i> KiMet metric (K) · <i>Audience:</i> creator only · <i>existing</i> <i>(Rule 3: this entry does not describe the market. The upfront disclosure required by master §2.2 is carried by the welcome screen and the disabled \"List publicly\" ager by email; they get read-only access to your dashboard and can prepare campaign reports for you, and you are told each time. <b>Agency:</b> a table of every creator who granted you access — platforms, Momentum, typical post, open reports, and now open disclosure flags.","<b>Creator:</b> grant, and withdraw in one tap. <b>Agency:</b> check the weekly digest and the disclosure column before campaigns go out.","<b>Agency — why this instead of screenshots:</b> instead of chasing creators for screenshots, the numbers are there, verified, with the creator's permission on record.","<i>Where:</i> Welcome; Settings · <i>Audience:</i> anyone evaluating · <i>existing</i>","Three sample creators, with every number computed by the real formulas.","A banner says it is sample data.","Explore before connecting.","Seeing the product without handing over anything.","The app is never empty.","Nothing in it is anyone's real data.","A screenshot tour shows a product; this lets you use it.","<i>Where:</i> Growth › Overview · <i>Source:</i> from the platform · <i>Audience:</i> creator · <i>existing</i>","Your follower level and your reach per post over time, with net new followers per day. On YouTube the level is rebuilt from daily gains and losses; on Instagram from daily new followers, anchored on today's count.","The follower line shows size; the reach line shows whether people see your posts.","Watch the two lines together; one rising while the other falls is the story.","Knowing whether you are growing, and whether growth reaches your posts.","Size without reach is an audience that has stopped watching.","Instagram gives only 30 days of follower history on the day you connect; the chart grows from there.","The public count is rounded (and can be hidden on YouTube); this is rebuilt from the daily figures.","<i>Where:</i> Content › Posts · <i>Source:</i> from the platform, with the viral score (K) · <i>Audience:</i> creator · <i>existing</i>","Every post with every insight the platform provides, filterable by platform and type (including Stories and Live), sortable, with the viral score on each row.","The pill on each row is the viral score: marigold for a breakout, red for well below your normal.","Sort by viral score; filter to one format; open the outliers.","Finding patterns across your whole catalogue.","The answer to \"what should I make next\" is usually already in your old posts.","Posts younger than day 7 are labelled \"so far\"; backfilled posts show lifetime figures, labelled.","No exporting, no spreadsheet; on the web it is a real sortable table with CSV export.","<i>Where:</i> Content › Times; Audience › When · <i>Source:</i> from the platform, read by KiMet · <i>Audience:</i> creator · <i>existing</i>","When your audience is active, and — on YouTube — your best publish days from your own history.","The outlined slots in the heat grid are your strongest times.","Schedule the next post into a strong slot.","Choosing when to post.","The first hours shape much of a post's reach.","It describes the past; a change in audience changes the answer.","Generic \"best time to post\" charts describe everyone's audience; this describes yours.","<i>Where:</i> Audience › Where · <i>Source:</i> from the platform · <i>Audience:</i> creator · <i>existing</i>","Where your audience is — cities and countries — and, on YouTube, what they watch on: phone, television, desktop, tablet.","\"16% of watch time is on a television\" means thumbnails and long-form behave differently for that group.","Match language, timing and thumbnails to where people are and how they watch.","Knowing your room.","A Mumbai audience on phones and a US audience on televisions need different videos.","City-level only, above the platform's minimums, never an estimate.","Brought together per platform in one place.","<i>Where:</i> Growth › Explore · <i>Source:</i> KiMet · <i>Audience:</i> creator · <i>existing</i>","Pick a metric, a dimension, a range and a comparison, and the chart renders instantly. Pin up to four views to Home.","Every view carries its computation line, like every other chart.","Answer the one question the fixed screens do not.","Depth on demand.","Every creator has one question nobody designed a screen for.","It only combines metrics KiMet already has; new metrics appear here first, and earn a fixed screen only later, if ever.","No export to a spreadsheet.","<i>Where:</i> Connect; Settings › Connections · <i>Audience:</i> creator · <i>existing</i>","Signing in through YouTube, Instagram or Threads' own official sign-in and permission screens, so KiMet can read your analytics.","\"Connected\" means KiMet can read; \"Reconnect\" means the permission expired.","Connect in context; disconnect any time.","Getting your own numbers, verified, in one place.","Reading through the platforms' own sign-in is what makes every KiMet number verifiable.","Read-only: KiMet never posts, edits or messages anyone for you. Disconnecting deletes your data within seven days. Instagram needs a Creator or Business account.","Nothing to screenshot, and nothing you can accidentally edit.","<i>Where:</i> the public page (`/handle`); PDF · <i>Audience:</i> creator; brand · <i>existing</i>","A live page of the creator's real numbers, read from their connected accounts with their permission. <b>Verified</b> figures (green tick) cannot be edited by anyone; <b>stated</b> ones (grey chip) — bio, rates, unconfirmed past work — are the creator's word, and labelled so.","Send the link instead of a deck.","Getting hired on real numbers.","Anyone can type any number into a deck, which is why brands discount every deck by instinct.","It does not set rates, take a cut or handle payment. It shows only what the platforms report, above their minimums. Momentum stays off it unless the creator switches it on.","Trust the ticks; weigh the stated chips as you would any claim.","Start with the card; open the full kit only if the card earns it.","Screenshots can be crop  const stated=(c.trackRecord||[]).filter(t=>t.verify==='stated').map(t=>({kind:'stated',brand:t.brand,when:t.date}));

 function compose(){const sc=$('#screen');if(!sc||S.screen==='home'||OBSCREENS.includes(S.screen))return;
  if(S.screen==='content'&&(S.tab.content||'posts')==='posts'){postsTable();return}
  if(S.screen==='kit'||S.screen==='profile'){kitDesk();return}

  const kids=[...sc.children];let i=0;const HEAD='.top,.seg,.chips,.title-row,.banner,.explain,.explain-min';
  while(i<kids.length&&kids[i].matches(HEAD))i++;const anchor=kids[i-1]||null;
  let items=[];const grids=[];kids.slice(i).forEach(e=>{if(e.matches('.web-grid')){grids.push(e);items.push(...e.children)}else items.push(e)});
  items=items.filter(e=>{const p=getComputedStyle(e).position;return p!=='fixed'&&p!=='sticky'}).filter(e=>e.textContent.trim()||e.querySelector('.ec,svg,img,canvas'));
  if(!items.length)return;

  const isRow=e=>!e.matches('section,.block,.hero,.tblwrap,.grid,.card,.builder,.kc,.dlist');const units=[];
  items.forEach(e=>{const last=units[units.length-1];if(isRow(e)&&last&&last.rows)last.els.push(e);else units.push({rows:isRow(e),els:[e]})});
  const U=units.map(u=>{if(!u.rows&&u.els.length===1)return u.els[0];const w=document.createElement('div');w.className='dlist';u.els.forEach(e=>w.appendChild(e));return w});
  const wide=e=>e.classList.contains('web-span')||!!e.querySelector('.tblwrap,table,.builder')||e.matches('.tblwrap,.builder,.divider,.banner')||(e.matches('.dlist')&&!e.querySelector('.ec,.alert,.row-btn,.kv,.post,.toggle'));
  const frag=document.createDocumentFragment();let pend=null;
  const band=(...ms)=>{const b=document.createElement('div');b.className='dband';ms.forEach(([e,s])=>{const m=document.createElement('div');m.className='dmod s'+s;m.appendChild(e);b.appendChild(m)});frag.appendChild(b)};
  /* Q2 (Karan, 11 Oct): between full-width blocks, sections are paired by similar length, so more of them sit side by
     side without a gap. Each pair keeps the reading position of its earlier section. Below 900 px everything stacks. */
  if(contentW()<900)U.forEach(e=>band([e,12]));
  else{const groups=[];let g=[];U.forEach(e=>{if(wide(e)){if(g.length)groups.push(g);g=[];groups.push(e)}else g.push(e)});if(g.length)groups.push(g);
   groups.forEach(x=>{if(!Array.isArray(x)){band([x,12]);return}pairByLength(x,sc).forEach(p=>p.length===2?band([p[0],6],[p[1],6]):band([p[0],12]))})}
  grids.forEach(g=>g.remove());if(anchor)anchor.after(frag);else sc.prepend(frag);

 function kitDesk(){const sc=$('#screen');const card=sc.querySelector('.kc');if(!card||sc.querySelector('.dkit'))return;
  const note=sc.querySelector(':scope > .banner');const head=card.previousElementSibling;const cta=sc.querySelector(':scope > .kcta')||sc.querySelector('.kcta');/* a creator's own bar (Request a collab, or the agreed state) wins over the kit's brand bar */

  const right=document.createElement('div');right.className='dk-right';const kf=sc.querySelector('.kfull');right.innerHTML=`<div class="dk-title"><h2>Full kit</h2><span>What a brand reads after the card. As a PDF, page one is the card, three pages at most.</span></div>`+(kf?'':kitFull());if(kf)right.appendChild(kf);right.querySelectorAll('.kcta').forEach(e=>e.remove());/* one request bar only: under the card */

 /* measure each section at half width, then pair neighbours by length; with an odd count, leave out the one that makes
    the pairs closest and give it a full-width band */
 function pairByLength(G,sc){if(G.length<2)return G.map(e=>[e]);const probe=document.createElement('div');probe.className='dband';probe.style.alignItems='start';
  const mods=G.map(e=>{const m=document.createElement('div');m.className='dmod s6';m.appendChild(e);probe.appendChild(m);return m});sc.appendChild(probe);
  const hs=mods.map(m=>m.getBoundingClientRect().height);probe.remove();
  const cost=list=>{const o=list.slice().sort((a,b)=>hs[a]-hs[b]);let c=0;for(let i=0;i<o.length;i+=2)c+=Math.abs(hs[o[i]]-hs[o[i+1]]);return {c,o}};
  const idx=G.map((_,i)=>i);let best=null;
  if(G.length%2===0)best={...cost(idx),left:null};else idx.forEach(r=>{const k=cost(idx.filter(i=>i!==r));if(!best||k.c<best.c)best={...k,left:r}});
  const pairs=[];for(let i=0;i<best.o.length;i+=2)pairs.push([best.o[i],best.o[i+1]].sort((a,b)=>a-b));if(best.left!=null)pairs.push([best.left]);
  return pairs.sort((a,b)=>a[0]-b[0]).map(p=>p.map(i=>G[i]))}

 function blankOf(m){const R=m.getBoundingClientRect();let bot=R.top;m.querySelectorAll('*').forEach(e=>{if(e.children.length&&e.tagName!=='svg')return;const q=e.getBoundingClientRect();if(q.height>0&&q.width>0)bot=Math.max(bot,q.bottom)});return R.bottom-parseFloat(getComputedStyle(m).paddingBottom)-bot}

 function postsTable(){const sc=$('#screen');const rows=[...sc.querySelectorAll(':scope > button.post')];if(!rows.length)return;
  const{c,plat,posts}=cur();const ft=S.tab.ptype||'all';const list=posts.filter(q=>ft==='all'||q.type===ft).slice(0,40);const pfs=[...new Set(list.map(q=>q.pf))];const mixed=pfs.length>1;

  r=r.replace('<button class="icon-btn" aria-label="Insights"','<input class="dsearch" type="search" placeholder="Search creators" aria-label="Search creators" value="'+String(S.netq||'').replace(/"/g,'&quot;')+'" onkeydown="if(event.key===\'Enter\'){S.netq=this.value;BACK.length=0;S.qp=null;KM.go(\'findcreators\')}"><span class="sdata" title="Every number here is sample data: three invented creators, computed by KiMet\'s real formulas">Sample data</span><button class="icon-btn" aria-label="Insights"');
  const end=r.lastIndexOf('</div>');return r.slice(0,end)+av+r.slice(end)};
 const XROWS=[['kitedit','Media kit',()=>I.doc,['kit','kitedit']],['findcreators','Find creators',()=>I.search,['findcreators','profile']],['requests','Requests',()=>I.users,['requests','rqdetail','collabnew']],['reports','Campaign reports',()=>I.share,['reports','reportnew','reportedit','report','report-expired','report-withdrawn','campinvite','campboard']],['cards','Share cards',()=>I.star,['cards','card-monthly','card-fans','card-shoutout']],['settings','Settings',()=>I.shield,['settings','connections','data','consent','formula','demo','network']]];
 const _tabbar=tabbar;tabbar=function(){const h=_tabbar();if(!isDesk())return h;const i=h.indexOf('<div class="web-extra"');if(i<0)return h;
  const hit=XROWS.find(x=>x[3].includes(S.screen));let main=h.slice(0,i);
  if(hit)main=main.replace(/class="tab on"/g,'class="tab "').replace(/aria-current="page"/g,'aria-current="false"');
  return main+`<div class="web-extra"><div class="sep"></div>${XROWS.map(([k,l,ic])=>{const on=hit&&hit[0]===k;const nb=k==='requests'?reqList('received').filter(r=>reqState(r)==='waiting').length:0;return `<button class="tab ${on?'on':''}" onclick="BACK.length=0;KM.go('${k}')" aria-current="${on?'page':'false'}">${ic()}<span>${l}</span>${nb?`<em class="nbadge">${nb}</em>`:''}</button>`}).join('')}</div></nav>`};
 const _openPost=KM.openPost;KM.openPost=id=>{if(isDesk()&&S.screen!=='post'){openQuick(id);return}_openPost(id)};
 KM.toggleWeb=()=>setDevice(isDesk()?'phone':'desktop');

 /* ---------- keyboard (design §7.3) and resize ---------- */
 document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
  if(e.key==='Escape'){if(S.sheet){KM.closeSheet();return}if(st.proto){toggleProto();return}if(S.qp){closeQuick();return}}
  if(isDesk()&&e.key==='/'){const q=document.getElementById('nq')||document.querySelector('.dsearch');if(q){e.preventDefault();q.focus()}return}
  if(isDesk()&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&/^[1-4]$/.test(e.key)){BACK.length=0;S.qp=null;KM.go(['home','content','growth','audience'][+e.key-1])}});
 let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(st.device==='desktop'){applyDevice('desktop');render()}else renderProto()},150)});
 document.addEventListener('click',e=>{if(!e.target.isConnected)return;if(st.proto&&!e.target.closest('#proto')){st.proto=false;renderProto()}});

 return {openProfile,sortPosts,tipSeen,init,after,isDesk,home,homeOpts,setDevice,toggleProto,goto,setCr,reset,openQuick,closeQuick,openFull,drag,fit,contentW,st};
})();
