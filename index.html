<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KiMet creator app · prototype v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
:root{
  --canvas:#F4F4F1; --paper:#FFFFFF; --ink:#141416; --ink2:#4B4D55; --ink3:#6A6C74;
  --rule:#E4E4DF; --rule2:#F0F0EC;
  --accent:#F2A900; --accent-ink:#7E5500; --accent-soft:#FFF3D1;
  --rise:#187A4E; --rise-soft:#E3F3EA; --fall:#C8321F; --fall-soft:#FBE7E3;
  --ig:#D62976; --yt:#E62117; --th:#1B1B1B;
  --sans:"Inter Tight","Inter",-apple-system,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --serif:"Source Serif 4","Newsreader",Charter,"Bitstream Charter",Georgia,serif;
  --r-s:6px; --r-m:12px; --r-l:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#D9D9D4;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums lining-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- device frame ---------- */
.stage{min-height:100%;display:flex;align-items:flex-start;justify-content:center;gap:28px;padding:24px 12px;flex-wrap:wrap}
.phone{width:390px;height:844px;background:var(--canvas);border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.28),0 0 0 10px #101012,0 0 0 12px #2a2a2e;overflow:hidden;position:relative;display:flex;flex-direction:column}
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600;flex:none}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.tabbar{flex:none;height:84px;background:var(--paper);border-top:1px solid var(--rule);display:flex;padding:8px 6px 22px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink3);padding-top:6px;border-radius:var(--r-m)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.tab.on svg{stroke-width:2.2}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;gap:8px;position:sticky;top:0;background:var(--canvas);z-index:5}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#F2A900,#D62976);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.switch{display:flex;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:3px;gap:2px}
.switch button{padding:8px 12px;position:relative;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink3);display:flex;align-items:center;gap:6px}
.switch button.on{background:var(--ink);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.ig{background:var(--ig)}.dot.yt{background:var(--yt)}.dot.th{background:var(--th)}.dot.all{background:linear-gradient(90deg,var(--ig),var(--yt))}
.icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;position:relative}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--fall);border:2px solid var(--canvas)}
.title-row{display:flex;align-items:baseline;justify-content:space-between;padding:8px 16px 4px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.subtle{color:var(--ink3);font-size:12.5px}
.back{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;padding:12px 12px;position:relative}
.back svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}

/* ---------- segmented ---------- */
.seg{display:flex;gap:18px;padding:4px 16px 0;border-bottom:1px solid var(--rule);margin:0 0 4px;position:sticky;top:50px;background:var(--canvas);z-index:4}
.seg button{padding:13px 0 12px;position:relative;font-size:14px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--ink);border-color:var(--ink)}

/* ---------- content blocks ---------- */
.block{padding:14px 16px 18px;border-bottom:1px solid var(--rule)}
.block:last-child{border-bottom:0}
.block h2{margin-bottom:2px}
.block .meta{color:var(--ink3);font-size:12.5px;margin-bottom:10px}
.hero{padding:6px 16px 18px;border-bottom:1px solid var(--rule)}
.momentum{display:flex;align-items:flex-end;gap:14px}
.momentum .num{font-size:88px;font-weight:700;letter-spacing:-.05em;line-height:.9}
.momentum .lbl{padding-bottom:10px}
.momentum .lbl b{display:block;font-size:15px;font-weight:700}
.momentum .lbl>span{display:block;color:var(--ink2);font-size:13px;margin-top:2px;line-height:1.35}
.track{margin-top:14px;height:10px;border-radius:999px;background:var(--rule);position:relative;overflow:visible}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.track em{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:3px solid var(--accent);transform:translateX(-50%)}
.track-lbls{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:8px}
.read{font-family:var(--serif);font-size:15.5px;line-height:1.5;color:var(--ink);border-left:2px solid var(--accent);padding-left:12px;margin-top:12px}
.read.small{font-size:14px;line-height:1.45;color:var(--ink2);margin-top:8px;border-color:var(--rule)}
.read.warn{border-color:var(--fall)}
.read b{font-weight:600}
.do{margin-top:10px;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink2)}
.do .k{flex:none;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:999px;font-size:11.5px;margin-top:1px}

/* stat strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 2px;scrollbar-width:none;scroll-snap-type:x mandatory}
.strip::-webkit-scrollbar{display:none}
.stat{flex:none;width:150px;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-m);padding:12px 12px 10px;scroll-snap-align:start}
.stat .l{font-size:12px;color:var(--ink3)}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-top:2px;display:flex;align-items:baseline;gap:8px}
.stat .v small{font-size:12px;font-weight:600}
.stat svg{display:block;margin-top:6px;width:100%;height:28px}
.stat .s{font-family:var(--serif);font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.35}
.up{color:var(--rise)}.down{color:var(--fall)}.flat{color:var(--ink3)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--rule2);color:var(--ink2)}
.pill.viral{background:var(--accent-soft);color:var(--accent-ink)}
.pill.up{background:var(--rise-soft);color:var(--rise)}
.pill.down{background:var(--fall-soft);color:var(--fall)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:13px 14px;position:relative;border-radius:999px;border:1px solid var(--rule);background:var(--paper);font-size:13px;font-weight:500;color:var(--ink2);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* post rows */
.post{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule2);align-items:center;width:100%;text-align:left}
.thumb{width:56px;height:70px;border-radius:8px;flex:none;position:relative;background:#DDD;overflow:hidden}
.thumb.wide{width:84px;height:48px}
.thumb.sq{width:56px;height:56px}
.thumb i{position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2))}
.thumb .plat{position:absolute;left:4px;top:4px;width:8px;height:8px;border-radius:50%;border:1.5px solid #fff}
.thumb .pt{position:absolute;right:4px;bottom:4px;font-size:9px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;padding:1px 5px;border-radius:4px}
.post .body{flex:1;min-width:0}
.post .cap{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .m{font-size:12px;color:var(--ink3);margin-top:3px;display:flex;gap:6px;align-items:center}
.post .r{text-align:right;flex:none}
.post .r b{font-size:15px;font-weight:700;display:block}
.post .r span{font-size:11.5px;font-weight:600}

/* metric grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid.c3{grid-template-columns:1fr 1fr 1fr}
.cell{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-m);padding:10px 12px}
.cell .l{font-size:11.5px;color:var(--ink3)}
.cell .v{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:1px}
.cell .c{font-size:11.5px;margin-top:2px;font-weight:600}
.cell .bar{height:4px;background:var(--rule);border-radius:2px;margin-top:8px;position:relative}
.cell .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ink)}
.cell .bar em{position:absolute;top:-3px;width:1px;height:10px;background:var(--accent)}

/* ranked bars */
.rank{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.rank .row{display:grid;grid-template-columns:122px 1fr 50px;gap:10px;align-items:center;font-size:13px}
.rank .row .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .row .b{height:14px;background:var(--rule2);border-radius:3px;position:relative}
.rank .row .b i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:3px}
.rank .row .b em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent)}
.rank .row .b s{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--ink3)}
.rank .row .x{text-align:right;font-weight:700}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);margin-top:10px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:0;border-top:2px solid var(--ink)}
.legend i.acc{border-color:var(--accent)}
.legend i.dash{border-top:2px dashed var(--ink3)}
.legend i.fill{width:10px;height:10px;border:0;border-radius:2px;background:var(--ink)}

/* charts */
.chart{width:100%;display:block;margin-top:8px}
.chart text{font-family:var(--sans);font-size:10px;fill:var(--ink3)}
.chart .ax{stroke:var(--rule);stroke-width:1}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.acc{stroke:var(--accent)}
.chart .ln.rise{stroke:var(--rise)}
.chart .ln.cohort{stroke:var(--ink3);stroke-dasharray:4 4;stroke-width:1.5}
.chart .ln.ig{stroke:var(--ig)}.chart .ln.yt{stroke:var(--yt)}.chart .ln.th{stroke:var(--th)}
.chart .ar{fill:var(--ink);opacity:.06}
.chart .ar.acc{fill:var(--accent);opacity:.16}
.chart .bar{fill:var(--ink)}
.chart .bar.rise{fill:var(--rise)}.chart .bar.fall{fill:var(--fall)}.chart .bar.mute{fill:var(--rule)}
.chart .mark{stroke:var(--ink3);stroke-dasharray:2 3}
.chart .pt{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.chart .pt.acc{stroke:var(--accent)}
.heat{display:grid;grid-template-columns:28px repeat(24,1fr);gap:2px;margin-top:10px}
.heat div{aspect-ratio:1;border-radius:2px;background:var(--rule2)}
.heat .h{font-size:9.5px;color:var(--ink3);display:flex;align-items:center;aspect-ratio:auto}
.heat .t{font-size:9px;color:var(--ink3);text-align:center;aspect-ratio:auto;background:none}
.heat .best{outline:2px solid var(--accent);outline-offset:-1px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.tbl th{text-align:left;font-weight:500;color:var(--ink3);font-size:11.5px;padding:6px 0;border-bottom:1px solid var(--rule)}
.tbl th:not(:first-child),.tbl td:not(:first-child){text-align:right}
.tbl td{padding:9px 0;border-bottom:1px solid var(--rule2);vertical-align:middle}
.tbl td b{font-weight:700}
.bullet{display:inline-block;width:56px;height:6px;background:var(--rule);border-radius:3px;position:relative;vertical-align:middle;margin-left:8px}
.bullet i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:3px}
.bullet em{position:absolute;top:-3px;width:2px;height:12px;background:var(--accent)}

/* alerts */
.alert{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rule2);align-items:flex-start;width:100%;text-align:left}
.alert .ic{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center}
.alert .ic.w{background:var(--fall-soft);color:var(--fall)}.alert .ic.g{background:var(--rise-soft);color:var(--rise)}.alert .ic.a{background:var(--accent-soft);color:var(--accent-ink)}.alert .ic.n{background:var(--rule2);color:var(--ink2)}
.alert .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.alert .t{font-size:14px;font-weight:600}
.alert .d{font-family:var(--serif);font-size:13.5px;color:var(--ink2);line-height:1.4;margin-top:2px}
.alert .w{font-size:11.5px;color:var(--ink3);margin-top:4px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;font-size:15.5px;font-weight:600;width:100%;background:var(--ink);color:#fff}
.btn.sec{background:var(--paper);color:var(--ink);border:1px solid var(--rule)}
.btn.ghost{background:none;color:var(--ink2);height:44px}
.btn.acc{background:var(--accent);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.sm{height:38px;font-size:13.5px;border-radius:10px;width:auto;padding:0 14px}
.row-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;border-bottom:1px solid var(--rule2);font-size:15px;text-align:left;gap:12px}
.row-btn .l{display:flex;flex-direction:column;gap:2px}
.row-btn .l span{font-size:12.5px;color:var(--ink3)}
.row-btn svg{width:18px;height:18px;stroke:var(--ink3);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.toggle{width:46px;height:28px;position:relative;border-radius:999px;background:var(--rule);position:relative;flex:none;transition:background .15s}
.toggle i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.toggle.on{background:var(--rise)}.toggle.on i{left:21px}
.toggle.off-locked{background:var(--rule)}

/* onboarding */
.ob{padding:20px 22px;display:flex;flex-direction:column;min-height:100%}
.ob .fill{flex:1}
.wordmark{font-size:20px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.wordmark i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.ob h1{font-size:34px;line-height:1.08;letter-spacing:-.03em;margin-top:18px}
.ob p{font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink2);margin-top:14px;max-width:32ch}
.ob .fine{font-size:12px;color:var(--ink3);text-align:center;margin-top:12px;line-height:1.45}
.plat-card{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:14px;width:100%;text-align:left;margin-top:10px}
.plat-card .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none}
.plat-card b{display:block;font-size:15px}
.plat-card span{font-size:12.5px;color:var(--ink3)}
.plat-card .st{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink3)}
.plat-card .st.ok{color:var(--rise)}
.progress{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:18px}
.progress i{display:block;height:100%;background:var(--accent);width:62%}
.steps{margin-top:16px;display:flex;flex-direction:column;gap:12px;font-size:14.5px}
.steps div{display:flex;gap:10px;align-items:center;color:var(--ink3)}
.steps div.done{color:var(--ink)}
.steps div.now{color:var(--ink);font-weight:600}
.steps i{width:18px;height:18px;border-radius:50%;border:2px solid var(--rule);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px}
.steps .done i{background:var(--ink);border-color:var(--ink);color:#fff}
.steps .now i{border-color:var(--accent);background:var(--accent-soft)}

/* share card */
.card{margin:14px 16px;background:var(--ink);color:#fff;border-radius:22px;padding:22px 20px;aspect-ratio:4/5;display:flex;flex-direction:column;position:relative;overflow:hidden}
.card .wm{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;opacity:.85}
.card .wm i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.card .mo{font-size:13px;opacity:.6;margin-top:22px}
.card .big{font-size:76px;font-weight:700;letter-spacing:-.05em;line-height:.95;color:var(--accent)}
.card .who{font-size:16px;font-weight:600;margin-top:4px}
.card .sub{font-family:var(--serif);font-size:15px;opacity:.8;margin-top:8px;line-height:1.4}
.card .k{margin-top:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;border-top:1px solid rgba(255,255,255,.18);padding-top:14px}
.card .k b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.card .k span{font-size:11px;opacity:.6}
.card .best{margin-top:16px;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.08);border-radius:12px;padding:10px}
.card .best .thumb{width:40px;height:50px}
.card .best b{font-size:13px;display:block}.card .best span{font-size:11.5px;opacity:.7}

/* value screen */
.lock{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--ink2);margin-top:10px}
.lock svg{width:15px;height:15px;stroke:var(--ink2);fill:none;stroke-width:2}
.formula{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px;margin-top:10px;font-size:13px}
.formula .f{font-family:var(--sans);font-weight:600;letter-spacing:-.01em;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.formula .f span{background:var(--rule2);padding:3px 8px;border-radius:6px}
.formula .f span.acc{background:var(--accent-soft);color:var(--accent-ink)}
.formula .parts{margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.formula .parts div{border-top:1px solid var(--rule);padding-top:6px}
.formula .parts b{display:block;font-size:16px}
.formula .parts span{font-size:11px;color:var(--ink3)}

/* notes */
.note{position:absolute;right:16px;background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;transform:translateY(-50%)}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;font-size:13.5px;display:none;z-index:20}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:30}
.sheet .in{background:var(--paper);border-radius:22px 22px 0 0;padding:14px 18px 34px;width:100%}
.sheet .h{width:36px;height:4px;background:var(--rule);border-radius:2px;margin:0 auto 14px}

.empty{padding:40px 24px;text-align:center}
.empty h2{font-size:18px}
.empty p{font-family:var(--serif);color:var(--ink2);margin-top:8px;line-height:1.45;font-size:14.5px}

/* explore builder */
.builder{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:12px;margin:10px 16px 0}

.builder .opts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* label helpers */
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--rule2)}
.kv span:last-child{font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--ink3);line-height:1.4;margin-top:8px}
.lift{font-size:12px;font-weight:600}

/* ---------- desktop / web layout ---------- */
.web-note{display:none}
@media (min-width:1100px){
  body.web .stage{padding:0}
  body.web .phone{width:100%;max-width:1280px;height:auto;min-height:100vh;border-radius:0;box-shadow:none;display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr}
  body.web .statusbar{display:none}
  body.web #tabs{grid-column:1;grid-row:1/3}
  body.web .tabbar{position:sticky;top:0;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--rule);padding:24px 12px;gap:4px;justify-content:flex-start}
  body.web .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:10px 12px}
  body.web .tab.on{background:var(--rule2)}
  body.web .screen{grid-column:2;grid-row:1/3;padding:0 32px 40px}
  body.web .top,body.web .seg{top:0}
  body.web .web-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;align-items:start}
  body.web .web-grid>.block,body.web .web-grid>.hero{border-bottom:1px solid var(--rule)}
  body.web .web-span{grid-column:1/3}
  body.web .screen>.block,body.web .screen>.hero,body.web .builder,body.web .screen>.chips,body.web .screen>.post,body.web .screen>.alert,body.web .screen>.row-btn{max-width:720px}
  body.web .screen>.title-row,body.web .seg{max-width:720px}
  body.web .web-grid{max-width:none}
  body.web .strip{flex-wrap:wrap;overflow:visible}
  body.web .stat{width:calc(25% - 8px)}
  body.web .momentum .num{font-size:110px}
  body.web .card{max-width:420px}
  body.web .toast,body.web .sheet{position:fixed;max-width:420px;left:auto;right:32px}
  body.web .web-note{display:block;position:fixed;right:16px;top:12px;font-size:12px;color:var(--ink3)}
  body.web .tabbar .brand{display:flex}
}
.tabbar .brand{display:none;font-size:18px;font-weight:800;letter-spacing:-.03em;padding:6px 12px 22px;align-items:center;gap:8px}
.tabbar .brand i{width:9px;height:9px;border-radius:50%;background:var(--accent)}


/* ---------- hit-area expansion (visual size unchanged, touch target >=44px) ---------- */
.switch button::after,.seg button::after,.subtle-btn::after,.pill[onclick]::after,
.btn.sm::after,.tbl button::after,.rank .row button::after{
  content:'';position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%);
}
.subtle-btn{position:relative;padding:6px 0;color:var(--ink3);font-size:12.5px}
.pill[onclick]{position:relative}
.btn.sm{position:relative;min-height:38px}
.icon-btn svg{width:22px;height:22px}
.avatar{font-size:14px}
/* readings sit against paper too */
.stat .s,.alert .d{color:var(--ink2)}

.builder .opts button::after,.back::after{content:'';position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}

.toggle::after{content:'';position:absolute;left:-8px;right:-8px;top:50%;height:44px;transform:translateY(-50%)}

/* ---------- V2 / leaderboards ---------- */
.rankno{width:22px;flex:none;font-size:13px;font-weight:700;color:var(--ink3);text-align:center}
.post.me{background:var(--accent-soft)}
.divider{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;color:var(--ink3);font-size:11.5px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--rule)}
.postgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.gcell{aspect-ratio:4/5;border-radius:8px;position:relative;overflow:hidden}
.gcell i{position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2))}
.gcell span{position:absolute;left:6px;bottom:5px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.slots{display:flex;gap:8px;margin-top:10px}
.slot{flex:1;aspect-ratio:1;border-radius:12px;border:2px dashed var(--rule);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink3)}
.slot.on{border:0;background:var(--ink);color:#fff}
.sheet .opts button{padding:10px 14px;border-radius:10px;border:1px solid var(--rule);font-size:14px;font-weight:600}
.sheet .opts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- expandable charts ---------- */
.title-row.exp{display:flex;align-items:center;justify-content:space-between}
.expand{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;margin-right:-8px}
.expand svg{width:17px;height:17px;stroke:var(--ink3);fill:none;stroke-width:2;stroke-linecap:round}
.expand:active{background:var(--rule2)}
.chartwrap{display:block;width:100%;position:relative;text-align:left}
.expand-hint{position:absolute;right:0;top:4px;opacity:.45}
.expand-hint svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:2}

/* ---------- chart chat ---------- */
.chatbox{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:12px;max-height:290px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{font-size:14px;line-height:1.45;padding:10px 12px;border-radius:12px;max-width:88%}
.msg.bot{background:var(--rule2);color:var(--ink);font-family:var(--serif);font-size:14.5px;border-bottom-left-radius:4px}
.msg.me{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.composer{display:flex;gap:8px;margin-top:10px;align-items:center}
.composer input{flex:1;height:46px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);padding:0 14px;font:inherit;font-size:14.5px;color:var(--ink)}

.composer .send{width:46px;height:46px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.composer .send svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- leaderboard v2 ---------- */
.season{display:flex;align-items:center;padding:10px 16px 4px}
.season b{font-size:14px;display:block}
.season span{font-size:12px;color:var(--ink3)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:14px 16px 0}
.pod{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pod .medal{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:var(--rule);color:var(--ink2)}

.pod.p2 .medal{background:#C9CAD0}
.pod.p3 .medal{background:#DFC0A0}

.pod .pm{font-size:10.5px;color:var(--ink3)}
.pod .pbar{width:100%;border-radius:8px 8px 0 0;background:var(--rule2);border:1px solid var(--rule);border-bottom:0;margin-top:6px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px}
.pod .pbar span{font-size:10px;font-weight:700;color:var(--ink3)}
.pod.p1 .pbar{background:var(--accent-soft);border-color:#F0DFAE}
.lbrow{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--rule2);width:100%;text-align:left}
.lbrow.me{background:var(--accent-soft)}
.lbrank{width:26px;flex:none;text-align:center}
.lbrank b{display:block;font-size:14px;font-weight:700}
.lbrank span{font-size:9.5px;font-weight:700}
.lbbody{flex:1;min-width:0}
.lbname{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.lbmeta{font-size:11.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--rule2);color:var(--ink2);flex:none}
.tag.hot{background:var(--accent-soft);color:var(--accent-ink)}
.lbspark{width:44px;flex:none;opacity:.55}
.lbval{text-align:right;flex:none;min-width:52px}
.lbval b{display:block;font-size:15px;font-weight:700}
.lbval span{font-size:10px;color:var(--ink3)}
.catchup{display:flex;gap:10px;align-items:center;margin:12px 16px 0;padding:12px;background:var(--paper);border:1px solid var(--rule);border-radius:12px}
.catchup svg{width:22px;height:22px;stroke:var(--accent-ink);fill:none;stroke-width:1.8;flex:none}
.catchup b{display:block;font-size:13.5px}
.catchup span{font-size:12px;color:var(--ink3)}
.card.lb{aspect-ratio:4/5}
.cardrow{display:flex;align-items:center;gap:10px}
.cardrow .cn{width:16px;font-size:13px;font-weight:800;color:var(--accent)}

.cardrow span{font-size:11.5px;opacity:.65}

.card .cardlist{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:10px}

.card .cardfill{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;margin-top:16px}

.block.live{background:linear-gradient(180deg,var(--accent-soft) 0%,rgba(255,243,209,0) 62%)}
.block.live .pill{flex:none}
.momentum .num span{font-weight:700;letter-spacing:-.03em}

.kv2{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:10px 0;border-bottom:1px solid var(--rule2);gap:12px}

.kcta{padding-bottom:22px}

@media (max-width:430px){.stage-note{display:none}}

.kmk{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--ink3);color:var(--ink3);font-size:9px;font-weight:800;margin-left:5px;vertical-align:2px;line-height:1;position:relative}

.funnel{display:flex;flex-direction:column;gap:8px;margin-top:8px}

.pgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:8px}
.pgrid div{aspect-ratio:1;border-radius:3px;background:var(--rule2)}

.inputrow{margin-top:12px}

.fanrow .rk.m1{color:var(--accent-ink)}.fanrow .rk.m2{color:#6E7078}.fanrow .rk.m3{color:#8A5A2B}

/* icon sizing — scoped, so it can never touch a chart */

 width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:-2px}

svg.chart{height:auto;width:100%;display:block}
.chart{height:auto}

/* no horizontal overflow anywhere */

 -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent)}

.tblwrap::-webkit-scrollbar{display:none}
.tbl{min-width:100%}
/* metrics directory */
.mrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule2);width:100%;text-align:left}
.mrow:last-child{border-bottom:0}

.mrow .mn b{display:block;font-size:14.5px;font-weight:600}
.mrow .mn>span{display:block;font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.4}
.mrow .mn .wh{color:var(--ink2);font-size:11.5px;margin-top:4px;font-weight:600}
.mrow .go{width:34px;height:34px}

.web-extra{display:none}
body.web .web-extra{display:flex}

/* ---------- v3 north-star components ---------- */
.kchead{display:flex;gap:12px;align-items:center}
.kc{margin:10px 16px 0;background:var(--paper);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.kc .kslot{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--rule2)}
.kc .kslot:first-child{border-top:0}
.kc .sn{flex:none;width:20px;height:20px;border-radius:50%;background:var(--rule2);color:var(--ink2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.kc .sb{flex:1;min-width:0}
.kc .sl{font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.kc .sv{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:2px;display:flex;align-items:center;gap:4px}

.kc .lk svg,.lockrow .lk svg{width:14px;height:14px}
.kc .foot{padding:10px 14px;background:var(--rule2);font-size:12px;color:var(--ink2)}

.recdots i{width:9px;height:9px;border-radius:50%;background:var(--ink2);display:inline-block}

.ibtn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:28px;min-height:28px;color:var(--ink3);border-radius:8px;flex:none;vertical-align:middle}
.ibtn::after{content:'';position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.ibtn svg{width:15px;height:15px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--rule2);font-size:13.5px;line-height:1.4}
.flag .fl{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--ink3)}
.flag.ok .fl{background:var(--rise)} .flag.warn .fl{background:var(--accent)} .flag.bad .fl{background:var(--fall)}
.flag.check .fl{background:transparent;border:1.5px solid var(--ink3)}
.rchip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:4px;border:1px solid var(--rule);color:var(--ink2);margin-left:6px;white-space:nowrap;vertical-align:middle}
.kind{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;border:1.5px solid var(--accent);color:var(--accent-ink);background:var(--accent-soft);vertical-align:middle}
.kind.after{border-color:var(--rule);color:var(--ink2);background:var(--rule2)}

.lockrow .lk{color:var(--ink3);display:inline-flex}
.rs h2{margin:6px 0 2px}

.rq{margin-top:12px}
.rq b{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em}
.rq p{margin:3px 0 0;font-size:14px;line-height:1.45;color:var(--ink)}
.wsarea{background:var(--paper);border:1px dashed var(--ink3);border-radius:14px;padding:12px 14px;margin-top:10px}
.wsarea b{display:block;font-size:14px}
.wsarea span{font-size:12.5px;color:var(--ink2);line-height:1.4}
.captxt{width:100%;min-height:110px;border:1px solid var(--rule);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;line-height:1.45;background:var(--paper);color:var(--ink);resize:vertical;margin-top:10px}
.mkbtn{position:relative;padding:10px 12px;border-radius:8px;border:1px solid var(--rule);font-size:12.5px;font-weight:600;background:var(--paper);color:var(--ink2)}
.mkbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mkbtn::after{content:'';position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}
.kmk::after{content:'';position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.explain .x::after{content:'';position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}
.icon-btn::after{content:'';position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.cinput input{height:40px}
.ibtn svg,.kc .lk svg,.lockrow .lk svg,.kind svg,.proto svg,.wsarea svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ===================== v4 · batch 1 (10 Oct 2026): desktop shell, ruled row bands, quick look, prototype pill =====================
   Desktop is a class-driven mode (body.desk), so the same CSS works on a wide screen and in the scaled preview on a phone.
   Decisions: Q4 (sidebar rows), Q9 (no module cap; reading lines capped; content to 1,680 px), Q10 (ruled sections in row
   bands), Q11 (light sidebar, solid marigold active item). The phone layout is untouched. */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (max-width:430px){.stage{height:100%}.phone{height:100%}}
.statusbar .sbadge{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.qpanel{display:none}
.top .sdata{display:none}

/* ---------- charts (batch 2: ECharts boxes; height comes from the chart, width from its column) ---------- */
.ec{width:100%;margin-top:8px;position:relative;overflow:hidden}
.stat .ec{margin-top:6px}
.ec svg{display:block;width:auto!important;height:auto!important;margin:0!important;max-width:none!important} /* v3.1 sized sparkline svgs (.stat svg); ECharts sizes its own */
.ec-off{font-size:12px;color:var(--ink3);padding:10px 0}

/* ---------- shell ---------- */
html:has(body.desk),body.desk{background:var(--canvas)}
body.desk .stage{padding:0;height:100%;min-height:0;display:block}
body.desk .phone{width:100%;max-width:none;height:100%;min-height:0;border-radius:0;box-shadow:none;display:grid;grid-template-columns:232px minmax(0,1fr) var(--qpw,0px);grid-template-rows:minmax(0,1fr);overflow:hidden}
body.desk .statusbar{display:none}
body.desk #tabs{grid-column:1;grid-row:1;min-height:0;display:flex}
body.desk #tabs:empty{display:none}
body.desk .phone:has(#tabs:empty){grid-template-columns:0 minmax(0,1fr) var(--qpw,0px)}
body.desk .tabbar{position:relative;top:auto;height:100%;width:100%;flex-direction:column;border-top:0;border-right:1px solid var(--rule);padding:22px 12px 72px;gap:2px;justify-content:flex-start;overflow-y:auto}
body.desk .tabbar .brand{display:flex}
body.desk .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:10px 12px;color:var(--ink2);width:100%;border-radius:10px}
body.desk .tab:hover{background:var(--rule2)}
body.desk .tab.on,body.desk .tab.on:hover{background:var(--accent);color:var(--ink);font-weight:650}
body.desk .tab svg{width:20px;height:20px}
body.desk .web-extra{display:flex;flex-direction:column;width:100%;gap:2px}
body.desk .tabbar .sep{height:1px;background:var(--rule);margin:12px 6px}
body.desk .screen{grid-column:2;grid-row:1;min-height:0;overflow-y:auto;padding:0 max(32px,calc((100% - 1680px) / 2)) 56px;container:scr / inline-size}
body.desk .top,body.desk .seg{top:0}

/* screens not yet composed for desktop keep the v3.1 web layout (batches 3 and 4 compose them) */
body.desk .web-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;align-items:start}
body.desk .web-grid>.block,body.desk .web-grid>.hero{border-bottom:1px solid var(--rule)}
body.desk .web-span{grid-column:1/3}
body.desk .screen>.block,body.desk .screen>.hero,body.desk .builder,body.desk .screen>.chips,body.desk .screen>.post,body.desk .screen>.alert,body.desk .screen>.row-btn,body.desk .screen>.title-row,body.desk .seg{max-width:720px}
body.desk .strip{flex-wrap:wrap;overflow:visible}
body.desk .stat{width:calc(25% - 8px)}
body.desk .momentum .num{font-size:110px}
body.desk .card{max-width:420px}
body.desk .toast,body.desk .sheet{position:fixed;max-width:420px;left:auto;right:32px}

/* ---------- top bar ---------- */
body.desk .top.dtop{justify-content:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);background:var(--canvas)}
body.desk .top.dtop .switch{flex:none;flex-wrap:nowrap;overflow:visible}
body.desk .top.dtop .sdata{display:inline-flex;align-items:center;margin-left:auto;font-size:11.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:4px 10px;border-radius:999px;white-space:nowrap}
body.desk .top.dtop .avatar{width:36px;height:36px;font-size:12px}

/* ---------- ruled row bands: modules in a band share one height; rules, not boxes ---------- */
body.desk .dband{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));margin:0 -24px;border-bottom:1px solid var(--rule)}
body.desk .dmod{min-width:0;padding:22px 24px 24px;display:flex;flex-direction:column}
body.desk .dmod+.dmod{border-left:1px solid var(--rule)}
body.desk .dmod.s4{grid-column:span 4}.dmod.s5{grid-column:span 5}.dmod.s6{grid-column:span 6}.dmod.s7{grid-column:span 7}.dmod.s8{grid-column:span 8}.dmod.s12{grid-column:1/-1}
body.desk .dmod>.block,body.desk .dmod>.hero,body.desk .dmod>section{padding:0!important;border:0!important;max-width:none!important;background:none!important}
body.desk .dmod .title-row{padding:0 0 12px!important;max-width:none}
body.desk .dmod .title-row h2{font-size:18px}
body.desk .dmod .read{max-width:62ch}
body.desk .dmod .hint{max-width:78ch}
body.desk .dmod.pacebg{background:linear-gradient(180deg,var(--accent-soft) 0%,rgba(255,243,209,0) 72%)}
body.desk .dmod .post{padding:12px 0}
body.desk .dmod .alert{padding:14px 0}
body.desk .dmod .alert:last-child{border-bottom:0}
body.desk .fitlist>[hidden]{display:none!important}
body.desk .dmod .strip{display:grid;grid-template-columns:repeat(var(--tc,2),minmax(0,1fr));gap:12px;padding:0;overflow:visible;scroll-snap-type:none}
body.desk .dmod .stat{width:auto;scroll-snap-align:none;display:flex;flex-direction:column}
body.desk .dmod.tiles-1 .stat .ec{min-height:72px}
/* tiles fill their module: rows share the band height, sparklines take the extra room, an odd last tile spans the row */
body.desk .dmod>section:has(>.strip){flex:1;display:flex;flex-direction:column}
body.desk .dmod .strip{flex:1;grid-auto-rows:1fr}
body.desk .dmod .stat .ec{height:auto!important;flex:1 1 40px;min-height:40px;margin-top:8px}
body.desk .dmod.tiles-2 .stat:last-child:nth-child(odd){grid-column:1/-1}
body.desk .dmod .dinputs{margin-top:16px}
body.desk .dmod .dform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:12px}
body.desk .dmod .dform .inputrow{margin:0}
body.desk .dmod .dform .inputrow .h{gap:4px 8px;flex-wrap:wrap}
body.desk .explain p:first-of-type{padding-right:60px}
.explain p:first-of-type{padding-right:52px}
body.desk .dmod .dinputs .cell{text-align:left}
body.desk .dmod .dinputs .cell .v{font-size:17px}
body.desk .dmod .dinputs .cell .l .dot{vertical-align:1px}
body.desk .dmod .quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:0}
body.desk .dmod .quick button{flex-direction:column;align-items:flex-start;gap:10px;position:relative;padding:14px 14px 16px;height:100%}
body.desk .dmod .quick button .qr{position:absolute;top:16px;right:14px}
body.desk .dmod .quick button span[style]{padding-right:4px}
body.desk .dfoot .hint{padding:16px 0 8px!important;max-width:78ch}
@container scr (max-width:760px){
  body.desk .dmod.s4,body.desk .dmod.s5,body.desk .dmod.s6,body.desk .dmod.s7,body.desk .dmod.s8{grid-column:1/-1}
  body.desk .dmod+.dmod{border-left:0;border-top:1px solid var(--rule)}
  body.desk .dmod .quick{grid-template-columns:1fr}
  body.desk .dmod .quick button{flex-direction:row;align-items:center}
  body.desk .dmod .quick button .qr{position:static;margin-left:auto}
}

/* slip 3 (master §7.2): no all-caps labels */
.kc .sl{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600}
.rtag{text-transform:none;letter-spacing:0}
.rq b{text-transform:none;letter-spacing:0}

/* batch 4: lists that travel together, onboarding, the public page */
body.desk .dlist>*{max-width:none}
body.desk .dmod .dlist .row-btn,body.desk .dmod .dlist .alert,body.desk .dmod .dlist .post,body.desk .dmod .dlist .kv{padding-left:0;padding-right:0}
body.desk .screen .ob{max-width:520px;margin:0 auto;min-height:0;padding-top:72px;padding-bottom:56px}
body.desk .screen .ob .fill{flex:0 0 32px}
body.desk .dkit{display:grid;grid-template-columns:minmax(360px,440px) minmax(0,1fr);gap:0 40px;align-items:start;padding:24px 0 40px}
body.desk .dk-left{position:sticky;top:20px}
body.desk .dk-left .block{padding-left:0;padding-right:0}
body.desk .dk-left .kcta{position:static;max-width:none;left:auto;margin:14px 0 0;border:1px solid var(--rule);border-radius:14px}
body.desk .dk-right>*{max-width:none}
body.desk .dk-right>.block,body.desk .dk-right>section{padding-left:0;padding-right:0}
body.desk .dk-title{padding:4px 0 6px;border-bottom:1px solid var(--rule)}
body.desk .dk-title h2{font-size:20px}
body.desk .dk-title span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
@container scr (max-width:860px){body.desk .dkit{grid-template-columns:1fr}body.desk .dk-left{position:static}}

/* Content › Posts table (batch 3) */
body.desk .dposts{margin:6px 0 8px}
body.desk .dposts .tbl{width:100%;font-size:13.5px}
body.desk .dposts th{white-space:nowrap;font-weight:600;color:var(--ink3);font-size:12px;text-align:left}
body.desk .dposts th.n,body.desk .dposts td.n{text-align:right}
body.desk .dposts tbody tr{cursor:pointer}
body.desk .dposts tbody tr:hover td{background:var(--rule2)}
body.desk .dposts tr.sel td{background:var(--accent-soft)}
body.desk .dposts td.c{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.desk .dposts .srt{font:inherit;color:inherit;padding:0}
body.desk .dposts .srt.on{color:var(--ink)}
body.desk .dposts .dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:1px}

<script>
const KM = {ver:'v0.1 formulas · prototype v3 (north-star build) · 27 Sep 2026'};
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(20260913);
const rnd=(a,b)=>a+(b-a)*R();
const rlog=(med,sig)=>med*Math.exp(sig*(R()+R()+R()+R()-2)*1.2); // rough lognormal
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt={
  n:v=>v==null?'—':v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e4?(v/1e3).toFixed(1)+'K':v>=1000?(v/1000).toFixed(1)+'K':Math.round(v).toLocaleString('en-IN'),
  pct:(v,d=1)=>v==null?'—':(v*100).toFixed(d)+'%',
  x:v=>v==null?'—':v.toFixed(v<10?2:1)+'×',
  d:v=>v==null?'—':(v>0?'+':'')+Math.round(v).toLocaleString('en-IN'),
  dpct:v=>v==null?'—':(v>0?'+':'')+(v*100).toFixed(1)+'%',
  date:d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}),
  ago:days=>days<1?'today':days<2?'yesterday':days<7?Math.round(days)+'d ago':days<30?Math.round(days/7)+'w ago':Math.round(days/30)+'mo ago'
};
const TODAY=new Date(2026,8,13); // 13 Sep 2026
const daysAgo=n=>new Date(TODAY.getTime()-n*864e5);

/* ---------- formulas (the real ones) ---------- */
const F={
  median(a){const s=a.filter(v=>v!=null).slice().sort((x,y)=>x-y);if(!s.length)return null;const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2},
  q(a,p){const s=a.filter(v=>v!=null).slice().sort((x,y)=>x-y);if(!s.length)return null;const i=(s.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)},
  // midrank percentile: 100 × (below + 0.5×equal)/n
  pct(arr,v){if(v==null||!arr.length)return null;let b=0,e=0;for(const x of arr){if(x<v)b++;else if(x===v)e++}return 100*(b+0.5*e)/arr.length},
  // geometric average weekly growth over 28 days
  growth4(now,d28){if(!now||!d28)return null;return Math.pow(now/d28,1/4)-1},
  growth1(now,d7){if(!now||!d7)return null;return now/d7-1},
  // consistency = 0.5×show_up + 0.5×min(median weekly ÷ norm, 1)
  consistency(weekly,norm){const W=weekly.length;if(W<4)return null;const show=weekly.filter(w=>w>0).length/W;const med=F.median(weekly);return{score:0.5*show+0.5*Math.min(med/norm,1),show:weekly.filter(w=>w>0).length,W,med,norm}},
  // per-post engagement rate (actions per exposure), frozen at day 7
  erPost(p,at){const m=at||p.d7;if(!m)return null;if(p.pf==='ig'){if(!m.reach)return null;return (m.likes+m.comments+m.saves+m.shares)/m.reach}
    if(p.pf==='yt'){if(!m.engaged)return null;return (m.likes+m.comments+m.shares+m.playlistAdds)/m.engaged}
    if(p.pf==='th'){if(!m.views)return null;return (m.likes+m.replies+m.reposts+m.quotes)/m.views}return null},
  // account ER = median of last 20 mature posts (min 5)
  erAccount(posts){const m=posts.filter(p=>p.mature&&p.type!=='story').slice(0,20).map(p=>F.erPost(p)).filter(v=>v!=null);return m.length>=5?{v:F.median(m),n:m.length}:{v:null,n:m.length}},
  // viral score: day-7 engaged views ÷ median(day-7 of last 20 same type, excl. self); min 12 same type else all types (min 5)
  viral(p,all){const key=p.pf==='yt'?'engaged':'views';const val=p.d7?p.d7[key]:null;if(val==null)return null;
    let pool=all.filter(q=>q.id!==p.id&&q.pf===p.pf&&q.type===p.type&&q.mature&&q.d7).slice(0,20);let widened=false;
    if(pool.length<12){pool=all.filter(q=>q.id!==p.id&&q.pf===p.pf&&q.type!=='story'&&q.mature&&q.d7).slice(0,20);widened=true}
    if(pool.length<5)return null;const med=F.median(pool.map(q=>q.d7[key]));return{v:val/med,med,widened,n:pool.length}},
  // "so far": views at age t vs median of same-type posts at the same age
  viralSoFar(p,all,t){const key=p.pf==='yt'?'engaged':'views';const pool=all.filter(q=>q.id!==p.id&&q.pf===p.pf&&q.type===p.type&&q.mature&&q.curve).slice(0,20);if(pool.length<5)return null;const med=F.median(pool.map(q=>q.curve(t)));return{v:p.curve(t)/med,med}},
  // Momentum = mean of available inputs (growth pct, ER pct, consistency×100)
  momentum(inputs){const a=inputs.filter(v=>v!=null);if(!a.length)return null;return Math.round(a.reduce((x,y)=>x+y,0)/a.length)},
  // value index: starts 100 the day the cohort exists; r = K × (M−50)/50 per day
  K:0.005,
  valueSeries(momentumByDay){let v=100;const out=[];for(const m of momentumByDay){if(m!=null)v*=1+F.K*(m-50)/50;out.push(v)}return out},
  supporter(s){return s.postsEngaged*1+s.tags*3+s.streak*2+(s.quotes||0)*2},
  bounce(m){return m&&m.views?1-m.engaged/m.views:null},
  // goal projection: linear on last-6-week daily net adds, range median..p75
  project(daily6w,now,target){const med=F.median(daily6w),p75=F.q(daily6w,.75);if(!med||med<=0)return null;const dLo=(target-now)/med,dHi=(target-now)/p75;return{lo:dLo,hi:dHi,med,p75}}
};
KM.F=F;
KM.formulas=[
 {name:'Momentum',v:'0.1',eff:'13 Sep 2026',def:'mean( percentile(growth_4w), percentile(engagement), consistency×100 )\ninputs missing → dropped from the mean and labelled\nshown as an integer; "Top N%" only when cohort n ≥ 50, else "Rank r of n"'},
 {name:'Seed value (index)',v:'0.1',eff:'13 Sep 2026',def:'value₀ = 100 on the day the cohort exists\nvalueₜ = valueₜ₋₁ × (1 + K × (Momentumₜ − 50) / 50),  K = 0.5%/day\nfrozen (r = 0) while inputs are older than 48h; history never rewritten'},
 {name:'Growth (4-week)',v:'0.1',eff:'13 Sep 2026',def:'(F_now / F_28d)^(1/4) − 1 — net of unfollows\nYouTube level rebuilt from daily subscribersGained − subscribersLost (public counts are rounded)'},
 {name:'Engagement rate',v:'0.1',eff:'13 Sep 2026',def:'Instagram: (likes+comments+saves+shares) ÷ reach\nYouTube:  (likes+comments+shares+playlistAdds) ÷ engagedViews\nThreads:  (likes+replies+reposts+quotes) ÷ views\nper post, frozen at day 7 · account = median of last 20 mature posts (min 5)\nno cross-platform "All" engagement rate exists'},
 {name:'Consistency',v:'0.1',eff:'13 Sep 2026',def:'0.5 × (weeks with a post ÷ 12) + 0.5 × min( median weekly posts ÷ cohort norm, 1 )\nnot percentiled — a standard you meet, not a race'},
 {name:'Viral score',v:'0.1',eff:'13 Sep 2026',def:'day-7 engagedViews ÷ median(day-7 of last 20 same-type posts, excluding this one)\nbefore day 7: views at age t ÷ median at the same age ("so far")\nmin 12 same-type posts, else all types on the platform (labelled), min 5'},
 {name:'Cohort',v:'0.1',eff:'13 Sep 2026',def:'platform × category × size band; sub-cohorts form at n ≥ 25 sharing a tag\nbelow 25 the pool widens one level and the label says which pool was used\npercentile = 100 × (below + ½ equal) ÷ n (midrank)'},
 {name:'Supporter score',v:'0.1',eff:'13 Sep 2026',def:'distinct posts engaged ×1 + tags/mentions ×3 + streak weeks ×2 + quotes ×2\ncomment count never enters it'},
 {name:'Bounce (YouTube hook)',v:'0.1',eff:'13 Sep 2026',def:'1 − engagedViews ÷ views  (views count from the first frame since 24 Aug 2026)'},
 {name:'Goal projection',v:'0.1',eff:'13 Sep 2026',def:'linear on daily net adds over the last 6 weeks; range = median … 75th percentile\n"on track" only when the lower bound reaches the target'},
 {name:'Forecast — "What to expect"',v:'0-provisional',eff:'27 Sep 2026',def:'PROVISIONAL — prototype only. The formula is an open decision (master v3 §6.11).\nd7 = engaged views (YouTube) or reach (Instagram) at day 7 — the figure lift uses\nhistory = last 20 organic posts of the same type, published ≥7 days before acceptance (min 5)\nband = P10 … P90 of history\nm = own median campaign lift if ≥3 committed campaigns; else the cohort\'s median sponsored lift (pool ≥25); else 1.0\nrange = band × m, widened 15% each side while fewer than 3 committed campaigns\nfrozen at acceptance; landed = the actual day-7 figure falls inside the frozen range'},
 {name:'Cohort sponsored-lift reading',v:'0-provisional',eff:'27 Sep 2026',def:'lift = day-7 figure ÷ median of the creator\'s organic same-type posts before acceptance\npercentile of lift among committed sponsored posts in the cohort (midrank); shown only when that pool has ≥25\nabove the median → "better than most sponsored posts in this category"; otherwise "at or below the typical sponsored post in this category"'}
];

function mkCurve(finalV,tau){return t=>finalV*(1-Math.exp(-Math.max(0,t)/tau))}
function mkHourly(finalV,tau){const out=[];for(let h=0;h<=48;h++){out.push(finalV*(1-Math.exp(-h/(tau*24))))}return out}
function retentionCurve(len,kind){const out=[];for(let i=1;i<=100;i++){const x=i/100;let v;
  if(kind==='strong')v=1.0-0.35*Math.pow(x,0.9)-(x<0.06?0.10*(1-x/0.06):0);else if(kind==='weak')v=1.0-0.62*Math.pow(x,0.6)-(x<0.08?0.25*(1-x/0.08):0);else v=1.0-0.48*Math.pow(x,0.8)-(x<0.06?0.16*(1-x/0.06):0);

let PID=0;
function post(cr,pf,type,ageDays,base,opts={}){
  const p={id:'p'+(++PID),cr,pf,type,age:ageDays,pub:daysAgo(ageDays),mature:ageDays>=7,backfilled:opts.backfilled||false,paid:opts.paid||false,brandPartner:opts.brandPartner||null,brand:opts.brand||null,tags:opts.tags||[],title:opts.title||'',dur:opts.dur||null,synthetic:false,committed:opts.committed||null,disc:opts.disc||null,ppFlag:opts.ppFlag||false,collab:opts.collab||false,liftTarget:opts.liftTarget||null};

KM.compute=function(c){

    const cn=c.conns[pf];const posts=c.posts.filter(p=>p.pf===pf);const lv=cn.level||[];
    const g4=lv.length>28?F.growth4(lv[0],lv[28]):null,g1=lv.length>7?F.growth1(lv[0],lv[7]):null;
    // weekly post counts over 12 weeks (stories excluded)
    const weekly=[];for(let w=0;w<12;w++)weekly.push(posts.filter(p=>p.type!=='story'&&p.age>=w*7&&p.age<(w+1)*7).length);
    const norm=(pf==='th'?(c.cohortTh||c.cohort).norm:c.cohort.norm);
    const cons=F.consistency(weekly,norm);
    const er=F.erAccount(posts);
    const pool=pools[pf]||null;const forming=!!c.cohort.forming||(!pool);
    const pG=pool&&g4!=null?F.pct(pool.map(x=>x.growth),g4):null;const pE=pool&&er.v!=null?F.pct(pool.map(x=>x.er),er.v):null;
    const mom=forming?null:F.momentum([pG,pE,cons?cons.score*100:null]);
    // ranks
    const n=pool?pool.length:0;
    const rank=v=>v==null?null:Math.round(n-(v/100)*n)+1;
    // yt extras
    let ctr=null,watch=null,bounce=null,pCtr=null,pWatch=null,pBounce=null;
    if(pf==='yt'){const mp=posts.filter(p=>p.mature&&p.type!=='live'&&p.d7);ctr=F.median(mp.map(p=>p.d7.ctr));watch=F.median(mp.filter(p=>p.type==='long').map(p=>p.d7.watchPct));bounce=F.median(mp.map(p=>F.bounce(p.d7)));if(pool){pCtr=F.pct(pool.map(x=>x.ctr),ctr);pWatch=F.pct(pool.map(x=>x.watch),watch);pBounce=100-F.pct(pool.map(x=>x.bounce),bounce)}}
    let saveRate=null,shareRate=null,pvRate=null,reachRate=null,pSave=null,pShare=null,pPv=null,pReach=null,skip=null;
    if(pf==='ig'){const mp=posts.filter(p=>p.mature&&p.type==='reel'&&p.d7);saveRate=F.median(mp.map(p=>p.d7.saves/p.d7.reach));shareRate=F.median(mp.map(p=>p.d7.shares/p.d7.reach));pvRate=F.median(mp.map(p=>p.d7.profileVisits/p.d7.views*1000));reachRate=F.median(mp.map(p=>p.d7.reach/cn.followers));skip=F.median(mp.map(p=>p.d7.skip));if(pool){pSave=F.pct(pool.map(x=>x.saveRate),saveRate);pShare=F.pct(pool.map(x=>x.shareRate),shareRate);pPv=F.pct(pool.map(x=>x.pv),pvRate);pReach=F.pct(pool.map(x=>x.reachRate),reachRate)}}
    const ppw=F.median(weekly);const pPpw=pool?F.pct(pool.map(x=>x.ppw),ppw):null;
    const viewsMed=F.median(posts.filter(p=>p.mature&&p.d7&&p.type!=='story').slice(0,20).map(p=>pf==='yt'?p.d7.engaged:p.d7.views));
    const pViews=pool?F.pct(pool.map(x=>x.viewsMed),viewsMed):null;

      inputs:[{k:'growth',label:'Growth (4-week)',v:g4,disp:fmt.dpct(g4)+'/wk',pct:pG},{k:'engagement',label:'Engagement rate',v:er.v,disp:fmt.pct(er.v),pct:pE},{k:'consistency',label:'Consistency',v:cons?cons.score:null,disp:cons?`${cons.show} of ${cons.W} weeks`:'—',pct:cons?cons.score*100:null,abs:true}]};

/* ---------- 5. cumulative (a post against your typical post, day 0 to the horizon) ---------- */
function cumulative(curve,typical,age,o={}){const{h=150,horizon=30,type='long',pf='yt'}=o;const n=70;const pts=[],tp=[];for(let i=0;i<=n;i++){const tt=i/n*horizon;pts.push([tt,curve(tt)]);tp.push([tt,typical?typical(tt):0])}
 const upto=pts.filter(p=>p[0]<=age);const last=upto[upto.length-1];const tl={short:'short',reel:'reel',long:'video',feed:'post',story:'story',live:'stream'}[type]||'post';const dsh=(type==='short'||type==='reel');
 return EC.box('cumulative',h,T=>{const mx=Math.max(...pts.map(p=>p[1]),...tp.map(p=>p[1]))||1;const ser=[];
  if(typical)ser.push({type:'line',name:'your typical '+tl,data:tp,symbol:'none',lineStyle:{color:T.ink3,width:1.5,type:[4,4]},itemStyle:{color:T.ink3},z:2});
  const ml=[{xAxis:7,lineStyle:{color:T.rule,type:[2,3]},label:{show:false}}];if(age<horizon)ml.push({xAxis:age,label:{formatter:'now · '+(age<1?Math.round(age*24)+'h':age.toFixed(1)+'d'),...(age>horizon*0.62?{align:'right',padding:[0,4,0,0]}:{})}});
  ser.push({type:'line',name:'this '+tl,data:upto,symbol:'none',lineStyle:{color:T.accent,width:2,type:dsh?[6,4]:'solid'},itemStyle:{color:T.accent},areaStyle:{color:hexA(T.accent,.16)},z:3,markPoint:ecEnd(T,pf,T.accent,last),markLine:ecMarkV(T,ml)});
  return {animation:false,grid:ecGrid(20,4),tooltip:ecTip(T,{formatter:ps=>{const x=ps[0].value[0];return `<b>${x<1?Math.round(x*24)+' hours in':'Day '+x.toFixed(1)} · ${pf==='yt'?'all views':'views'}</b><br>`+ps.map(p=>`${p.marker}${p.seriesName} <b>${fmt.n(p.value[1])}</b>`).join('<br>')}}),
   xAxis:{type:'value',min:0,max:horizon,interval:1,axisLine:{show:false},axisTick:{show:false},splitLine:{show:false},axisLabel:{...ecLab(T),hideOverlap:false,formatter:v=>v===0?'0':v===7?'day 7 · frozen':v===horizon?horizon+'d':''}},
   yAxis:ecValY(T,0,mx,2,v=>fmt.n(v)),series:ser}},o.aria||'Views since posting, against your typical '+tl)}

/* ---------- 6. retention (YouTube: who is still watching, start to end) ---------- */
function retention(ret,rel,o={}){const{h=158}=o;let di=1,dv=0;for(let i=1;i<100;i++){const dd=ret[i-1]-ret[i];if(dd>dv){dv=dd;di=i}}const bi=ret.findIndex(v=>v>1.02);const cap=v=>Math.min(1.3,v);
 return EC.box('retention',h,T=>{const pts=[{coord:[di,cap(ret[di])],value:'biggest drop · '+di+'%',itemStyle:{color:T.fall},label:{color:T.fall,position:di>58?'left':'right'}}];
  if(bi>0&&ret[bi+3]!=null)pts.push({coord:[bi+3,cap(ret[bi+3])],value:'rewatched',itemStyle:{color:T.rise},label:{color:T.rise,position:'left'}});
  const ser=[{type:'line',name:'still watching',data:ret.map(cap),symbol:'none',lineStyle:{color:T.accent,width:2},itemStyle:{color:T.accent},areaStyle:{color:hexA(T.accent,.16)},z:3,
   markPoint:{symbol:'circle',symbolSize:8,silent:true,label:{show:true,formatter:p=>p.data.value,fontSize:10,fontFamily:T.sans,distance:6},data:pts}}];
  if(rel)ser.push({type:'line',name:'similar videos',yAxisIndex:1,data:rel,symbol:'none',lineStyle:{color:T.ink3,width:1.5,type:[4,4]},itemStyle:{color:T.ink3},z:2});
  return {animation:false,grid:ecGrid(14,4),tooltip:ecTip(T,{formatter:ps=>{const i=ps[0].dataIndex;return `<b>${i}% into the video</b><br>`+ps.map(p=>p.seriesIndex===0?`${p.marker}still watching <b>${Math.round(ret[i]*100)}%</b>`:`${p.marker}against similar videos <b>${(+rel[i]).toFixed(2)}</b> (0.50 is typical)`).join('<br>')}}),
   xAxis:{type:'category',data:Array.from({length:ret.length},(_,i)=>i),boundaryGap:false,axisLine:{show:false},axisTick:{show:false},axisLabel:{...ecLab(T),interval:0,hideOverlap:false,formatter:v=>+v===0?'start':+v===ret.length-1?'end':''}},
   yAxis:[{type:'value',min:0,max:1.3,interval:0.5,axisLine:{show:false},axisTick:{show:false},splitLine:{lineStyle:{color:T.rule}},axisLabel:{...ecLab(T),formatter:v=>v>0&&v<=1.01?Math.round(v*100)+'%':''}},{type:'value',min:0,max:1,show:false,axisLabel:{show:false}}],series:ser}},'Audience retention from start to end')}

/* ---------- 7. live (viewers by minute) ---------- */
function liveChart(L,o={}){const{h=140}=o;const s=L.series,n=s.length,pk=s.indexOf(L.peak);
 return EC.box('live',h,T=>{const mx=Math.max(...s)||1;return {animation:false,grid:ecEdge(['0 min',L.mins+' min'],n,ecGrid(20,4)),tooltip:ecTip(T,{formatter:ps=>`<b>Minute ${ps[0].dataIndex}</b><br>${ps[0].marker}watching <b>${fmt.n(ps[0].value)}</b>`}),
  xAxis:ecCatX(T,n,['0 min',L.mins+' min'],false),yAxis:ecValY(T,0,mx,2,v=>fmt.n(v)),
  series:[{type:'line',name:'watching',data:s,symbol:'none',lineStyle:{color:T.fall,width:2,type:[2,4]},itemStyle:{color:T.fall},areaStyle:{color:hexA(T.fall,.1)},
   markLine:{...ecMarkV(T,[{yAxis:L.avg,lineStyle:{color:T.ink3,width:1.5,type:[4,4]},label:{show:true,position:'insideStartTop',align:'left',padding:0,formatter:'average '+fmt.n(L.avg)}},{xAxis:pk,label:{formatter:`peak ${fmt.n(L.peak)} · min ${pk}`}}])}}]}},'Live viewers by minute')}

/* ---------- 8. velocity (interactions per hour, first 48 hours) ---------- */
function velocity(hourly,typical,upTo,o={}){const{h=132}=o;const up=hourly.slice(0,Math.max(2,Math.floor(upTo)+1));
 return EC.box('velocity',h,T=>{const mx=Math.max(...hourly,...(typical||[0]))||1;const ser=[];
  if(typical)ser.push({type:'line',name:'typical',data:typical.map((v,i)=>[i,v]),symbol:'none',lineStyle:{color:T.ink3,width:1.5,type:[4,4]},itemStyle:{color:T.ink3},z:2});
  ser.push({type:'line',name:'this post',data:up.map((v,i)=>[i,v]),symbol:'none',lineStyle:{color:T.accent,width:2},itemStyle:{color:T.accent},z:3,markArea:{silent:true,data:[[{xAxis:0,itemStyle:{color:T.rule2}},{xAxis:1}],[{xAxis:1,itemStyle:{color:hexA(T.rule2,.5)}},{xAxis:24}]]}});
  return {animation:false,grid:ecGrid(10,4),tooltip:ecTip(T,{formatter:ps=>`<b>Hour ${ps[0].value[0]}</b><br>`+ps.map(p=>`${p.marker}${p.seriesName} <b>${fmt.n(p.value[1])}</b>`).join('<br>')}),
   xAxis:{type:'value',min:0,max:48,interval:0.5,axisLine:{show:false},axisTick:{show:false},splitLine:{show:false},axisLabel:{...ecLab(T),hideOverlap:false,formatter:v=>v===0.5?'1h':v===12?'first 24h':v===36?'24–48h':''}},
   yAxis:ecValY(T,0,mx,1,v=>fmt.n(v)),series:ser}},'Interactions per hour in the first 48 hours')}

/* ---------- 9. stacked shares by week ---------- */
function stackcols(weeks,keys,o={}){const cols=['var(--ink)','var(--accent)','#8B8D95','#C9CAD0','var(--rise)','#E2E2DC','#6A6C74'];const n=weeks.length;
 const b=EC.box('stack',o.h||142,T=>{const cc=cols.map(c=>c==='var(--ink)'?T.ink:c==='var(--accent)'?T.accent:c==='var(--rise)'?T.rise:c);const tot=weeks.map(wk=>keys.reduce((s,k)=>s+(wk[k]||0),0)||1);
  const head=i=>i===0&&o.x0?o.x0:i===n-1?(o.x1||'this week'):`week ${i+1} of ${n}`;
  return {animation:false,grid:ecEdge([o.x0||'',o.x1||'this week'],n,ecGrid(6,4,4,4)),tooltip:ecTip(T,{axisPointer:{type:'shadow',shadowStyle:{color:hexA(T.ink,.05)}},formatter:ps=>`<b>${head(ps[0].dataIndex)}</b><br>`+ps.slice().reverse().map(p=>`${p.marker}${p.seriesName} <b>${fmt.pct(p.value,0)}</b>`).join('<br>')}),
   xAxis:ecCatX(T,n,[o.x0||'',o.x1||'this week'],true),yAxis:{type:'value',min:0,max:1,show:false,axisLabel:{show:false}},
   series:keys.map((k,j)=>({type:'bar',name:k,stack:'s',barWidth:'86%',data:weeks.map((wk,i)=>(wk[k]||0)/tot[i]),itemStyle:{color:cc[j%cc.length]}}))}},o.aria||'Share by week');
 return b+`<div class="legend">${keys.map((k,j)=>`<span><i class="fill" style="background:${cols[j%cols.length]}"></i>${k}</span>`).join('')}</div>`}

/* ---------- 10. quadrant (YouTube: click-through against watch percentage) ---------- */
function quadrant(posts,o={}){const{h=220}=o;
 return EC.box('quadrant',h,T=>{const xs=posts.map(p=>p.d7.ctr),ys=posts.map(p=>p.d7.watchPct);const mxm=F.median(xs),mym=F.median(ys);const pad=a=>{const lo=Math.min(...a),hi=Math.max(...a),r=(hi-lo)||1;return [lo-r*.08,hi+r*.08]};const[x0,x1]=pad(xs),[y0,y1]=pad(ys);
  const txt=(pos,text,anchor)=>({type:'text',...pos,style:{text,fill:T.ink3,font:`10px ${T.sans}`,textAlign:anchor}});
  return {animation:false,grid:{left:10,right:12,top:24,bottom:38,containLabel:false},
   tooltip:{...ecTip(T),trigger:'item',formatter:p=>{const q=posts[p.dataIndex];return `<b>${q.title}</b><br>click-through <b>${fmt.pct(q.d7.ctr)}</b><br>watched <b>${fmt.pct(q.d7.watchPct,0)}</b>`}},
   xAxis:{type:'value',min:x0,max:x1,show:false,axisLabel:{show:false}},yAxis:{type:'value',min:y0,max:y1,show:false,axisLabel:{show:false}},
   graphic:[txt({left:10,top:6},'clicked, not watched'),txt({right:12,top:6},'works'),txt({left:10,bottom:20},'weak both'),txt({right:12,bottom:20},'watched, not clicked'),txt({left:'center',bottom:2},'click-through rate →')],
   series:[{type:'scatter',symbol:'rect',symbolSize:8,data:posts.map(p=>({value:[p.d7.ctr,p.d7.watchPct],itemStyle:{color:T.paper,borderColor:p.hl?T.accent:T.ink,borderWidth:2}})),
    markLine:{silent:true,symbol:'none',lineStyle:{color:T.ink3,type:[2,3],width:1},label:{show:false},data:[{xAxis:mxm},{yAxis:mym}]}}]}},'Click-through against watch percentage, one square per video')}

/* ---------- 11. dumbbell (you against the cohort median) ---------- */
function dumbbell(rows,o={}){const h=rows.length*32+16;
 const b=EC.box('dumbbell',h,T=>{const all=rows.flatMap(r=>[r.you,r.cohort]).filter(v=>v!=null);let mn=Math.min(...all),mx=Math.max(...all);if(!(mx>mn))mx=mn+1;const pad=(mx-mn)*.1;const f=(r,v)=>r.fmt?r.fmt(v):String(v);
  return {animation:false,grid:{left:6,right:12,top:6,bottom:6,containLabel:true},
   tooltip:{...ecTip(T),trigger:'item',formatter:p=>{const r=rows[p.data.ri];return `<b>${r.label}</b><br>you <b>${r.you!=null?f(r,r.you):'not yet'}</b><br>cohort median <b>${r.cohort!=null?f(r,r.cohort):'not yet'}</b>`}},
   xAxis:{type:'value',min:mn-pad,max:mx+pad*3,show:false,axisLabel:{show:false}},yAxis:{type:'category',data:rows.map(r=>r.label),inverse:true,axisLine:{show:false},axisTick:{show:false},axisLabel:{color:T.ink,fontSize:12,fontFamily:T.sans}},
   series:[{type:'custom',silent:true,z:1,data:rows.map((r,i)=>[0,i]),renderItem:(pa,api)=>{const r=rows[pa.dataIndex];if(r.you==null||r.cohort==null)return null;const a=api.coord([r.cohort,pa.dataIndex]),c=api.coord([r.you,pa.dataIndex]);return {type:'line',shape:{x1:a[0],y1:a[1],x2:c[0],y2:c[1]},style:{stroke:T.rule,lineWidth:4}}}},
    {type:'scatter',name:'cohort median',symbol:'circle',symbolSize:9,z:2,itemStyle:{color:T.ink3},data:rows.map((r,i)=>r.cohort!=null?{value:[r.cohort,i],ri:i}:null).filter(Boolean)},
    {type:'scatter',name:'you',z:3,itemStyle:{color:T.paper,borderColor:T.accent,borderWidth:2},data:rows.map((r,i)=>{if(r.you==null)return null;const[s,z]=EC_SYM[r.pf||'yt']||EC_SYM.yt;const right=r.you>=(r.cohort!=null?r.cohort:-Infinity);
      return {value:[r.you,i],ri:i,symbol:s,symbolSize:z+1,label:{show:true,position:right?'right':'left',distance:8,formatter:f(r,r.you),color:T.ink,fontWeight:700,fontSize:11,fontFamily:T.sans}}}).filter(Boolean)}]}},'You against the cohort median');
 return b+`<div class="legend"><span><i class="fill" style="background:var(--paper);border:2px solid var(--ink)"></i>you (median)</span><span><i class="fill" style="background:var(--ink3);border-radius:50%"></i>cohort median</span></div>`}

/* ---------- 12. ranked list (ages, cities, sources, devices, search terms...) ----------

function rankbars(items,o={}){const f=o.fmt||(v=>fmt.pct(v,0));const n=items.length;const hasMark=items.some(i=>i[2]!=null);
 return EC.box('rank',Math.max(34,n*27+6),T=>{const mx=Math.max(...items.map(i=>Math.max(i[1],i[2]||0)))||1;const labs=items.map(i=>String(i[0]));

   label:{show:true,position:'right',distance:6,formatter:p=>f(items[p.dataIndex][1]),color:T.ink,fontWeight:700,fontSize:12,fontFamily:T.sans}}];
  if(hasMark)ser.push({type:'scatter',symbol:'rect',symbolSize:[2,16],z:3,itemStyle:{color:T.ink3},data:items.map((i,k)=>i[2]!=null?[i[2],k]:null).filter(Boolean),tooltip:{show:false}});
  return {animation:false,grid:{left:10,right:56,top:2,bottom:2,containLabel:true},/* 10 px: label widths are estimated before the font settles */
   tooltip:{...ecTip(T),trigger:'item',formatter:p=>{const it=items[p.dataIndex];return `<b>${it[0]}</b><br>${f(it[1])}${it[2]!=null?`<br>typical ${f(it[2])}`:''}`}},

/* ---------- 13. story funnel (frame by frame: kept watching, exited, tapped back) ---------- */
function funnel(frames){const n=frames.length;
 const b=EC.box('funnel',n*27+6,T=>({animation:false,grid:{left:10,right:84,top:2,bottom:2,containLabel:true},
  tooltip:{...ecTip(T),trigger:'axis',axisPointer:{type:'shadow',shadowStyle:{color:hexA(T.ink,.05)}},formatter:ps=>{const f=frames[ps[0].dataIndex];return `<b>Frame ${ps[0].dataIndex+1}</b><br>watched <b>${fmt.n(f.views)}</b><br>exited here <b>${fmt.n(f.exit)}</b>${f.back?`<br>tapped back <b>${fmt.n(f.back)}</b>`:''}`}},
  xAxis:{type:'value',min:0,max:frames[0].views||1,show:false,axisLabel:{show:false}},
  yAxis:{type:'category',data:frames.map((_,i)=>'frame '+(i+1)),inverse:true,axisLine:{show:false},axisTick:{show:false},axisLabel:{color:T.ink3,fontSize:12,fontFamily:T.sans}},
  series:[{type:'bar',stack:'f',barWidth:10,data:frames.map(f=>f.views-f.exit),itemStyle:{color:T.ink}},
   {type:'bar',stack:'f',barWidth:10,data:frames.map(f=>f.exit),itemStyle:{color:T.fall,borderRadius:[0,3,3,0]},label:{show:true,position:'right',distance:6,formatter:p=>{const f=frames[p.dataIndex];return fmt.n(f.views)+(f.back?'  ↺ '+fmt.n(f.back):'')},color:T.ink,fontWeight:700,fontSize:12,fontFamily:T.sans}}]}),'Story frames: kept watching, exited, tapped back');
 return b+`<div class="legend"><span><i class="fill"></i>kept watching</span><span><i class="fill" style="background:var(--fall)"></i>exited here</span><span>↺ tapped back</span></div>`}
/* ---------- 14. posting grid (posts per week, last 12 weeks) ---------- */

 const b=EC.box('pgrid',38,T=>({animation:false,grid:{left:0,right:0,top:2,bottom:2},
  tooltip:{...ecTip(T),trigger:'item',formatter:p=>{const i=p.value[0],ago=n-1-i;return `<b>${ago===0?'This week':ago===1?'Last week':ago+' weeks ago'}</b><br>${w[i]} post${w[i]===1?'':'s'}`}},
  xAxis:{type:'category',data:w.map((_,i)=>i),show:false},yAxis:{type:'category',data:[0],show:false},

  series:[{type:'heatmap',data:w.map((v,i)=>[i,0,v]),itemStyle:{borderColor:T.canvas,borderWidth:3,borderRadius:4}}]}),'Posts per week, last 12 weeks');

function content(){const{c,m,plat,posts}=cur();const p=plat==='all'?c.primary:plat;const x=m.pf[p];const t=S.tab.content;
 let body='';
 if(t==='posts'){const ft=S.tab.ptype;const avail=['all','long','short','reel','feed','story','live','text'].filter(k=>k==='all'||posts.some(q=>q.type===k));

   <div class="hint" style="padding:0 16px 8px">Newest first. The number is ${p==='yt'?'engaged views':'views'} at day 7 — "so far" until then. The multiple beside it is viral score${KM.kmark('Viral score')}: this post against your typical of the same type.</div>
   ${list.map(postRow).join('')}
   <div class="divider">older posts load as you scroll — to your first upload on YouTube, two years on Instagram</div>`}
 if(t==='formats'){const pls=plat==='all'?Object.keys(c.conns):[p];
  body=pls.map(pl=>{const types=[...new Set(c.posts.filter(q=>q.pf===pl&&q.type!=='story').map(q=>q.type))];
   const all=F.median(c.posts.filter(q=>q.pf===pl&&q.type!=='story'&&q.mature&&q.d7).map(q=>q.d7[pl==='yt'?'engaged':'views']));
   const rows=types.map(ty=>{const ps=c.posts.filter(q=>q.pf===pl&&q.type===ty&&q.mature&&q.d7);const key=pl==='yt'?'engaged':'views';
    return{ty,n:ps.length,med:F.median(ps.map(q=>q.d7[key])),lift:F.median(ps.map(q=>q.d7[key]))/all,er:F.median(ps.map(q=>F.erPost(q))),
      ctr:pl==='yt'?F.median(ps.map(q=>q.d7.ctr)):null,watch:pl==='yt'&&ty==='long'?F.median(ps.map(q=>q.d7.watchPct)):null,
      nf:pl==='ig'?F.median(ps.map(q=>q.d7.nonFollowerShare)):null,pv:pl==='ig'?F.median(ps.map(q=>q.d7.profileVisits/q.d7.views*1000)):null}}).sort((a,b)=>b.lift-a.lift);
   const xm=m.pf[pl];
   return `<section class="block">${titleRow('Your formats, ranked',`${KM.src(pl)}${expandBtn(pl==='yt'?'watch':pl==='ig'?'reach':'engagement')}`)}
    <div class="tblwrap"><table class="tbl"><tr><th>Format</th><th>n</th><th>typical</th><th>lift</th>${pl==='yt'?'<th>CTR</th><th>watch</th>':pl==='ig'?'<th>non-fol.</th><th>visits/1K</th>':''}<th>ER</th></tr>
    ${rows.map(r=>`<tr><td>${TYPEL[r.ty]}s</td><td>${r.n}</td><td>${fmt.n(r.med)}</td><td><b>${fmt.x(r.lift)}</b></td>${pl==='yt'?`<td>${fmt.pct(r.ctr)}</td><td>${r.watch?fmt.pct(r.watch,0):'—'}</td>`:pl==='ig'?`<td>${fmt.pct(r.nf,0)}</td><td>${r.pv?r.pv.toFixed(1):'—'}</td>`:''}<td>${fmt.pct(r.er)}</td></tr>`).join('')}</table></div>
    <div class="hint">Lift is this format's typical divided by your typical across all formats, at day 7. Stories are excluded from every rate; Live is measured by concurrents and sits in its own row.</div>
    ${pl==='yt'?dumbbell([{label:'CTR · long-form',you:rows.find(r=>r.ty==='long').ctr,cohort:F.median(xm.pool.map(k=>k.ctr)),fmt:v=>fmt.pct(v),pf:'yt'},{label:'CTR · Shorts',you:rows.find(r=>r.ty==='short')?rows.find(r=>r.ty==='short').ctr:null,cohort:F.median(xm.pool.map(k=>k.ctr))*1.6,fmt:v=>fmt.pct(v),pf:'yt'},{label:'Watch % · long-form',you:rows.find(r=>r.ty==='long').watch,cohort:F.median(xm.pool.map(k=>k.watch)),fmt:v=>fmt.pct(v,0),pf:'yt'}]):''}
    ${readN(pl==='yt'?`Shorts bring the views; long-form brings the subscribers. A typical Short does ${fmt.n(rows.find(r=>r.ty==='short')?rows.find(r=>r.ty==='short').med:0)} engaged views against ${fmt.n(rows.find(r=>r.ty==='long').med)} for a video — but a video converts 2.8× the subscribers per thousand non-subscriber views. If that pattern holds, one extra video a month is worth roughly 190 subscribers.`
     :pl==='ig'?`Reels reach ${fmt.pct(rows.find(r=>r.ty==='reel').nf,0)} non-followers; feed posts ${fmt.pct(rows.find(r=>r.ty==='feed')?rows.find(r=>r.ty==='feed').nf:0,0)}. Reels bring strangers, feed posts bring them to your profile. Two jobs, both real.`
     :`Posts with a link get 2.3× the replies and are the only format with click data. Your pool posts ${xm.cons.norm} a week; you post ${xm.ppw}.`)}
    <div class="hint">Lift is correlation, not cause — "if the pattern holds" is doing real work in that sentence.</div></section>`}).join('')}
 if(t==='times'){
  if(p==='ig'){const cn=c.conns.ig;body=`<section class="block">${titleRow('When your followers are online',KM.src('ig'))}${heat(cn.online)}
    <div class="hint">Last 30 days, IST. Instagram keeps only 30 days of this, so the window never gets longer.</div>
    ${readN(KM.onlineRead(cn.online))}</section>
   <section class="block">${titleRow('Best three slots')}${(()=>{const sl=KM.onlineSlots(cn.online);return sl.map(s=>`<div class="kv"><span>${s.label}</span><span>${s.share}</span></div>`).join('')+`<button class="btn sec sm" style="margin-top:10px" onclick="KM.toast('Reminder set 30 minutes before ${sl[0].label.split(',')[0]} and ${sl[1].label.split(',')[0]} slots')">Remind me before these</button>`})()}</section>
   <section class="block">${titleRow('When you actually post')}${(()=>{const L=c.posts.filter(q=>q.pf===p).slice().sort((a,b)=>b.pub-a.pub).slice(0,50);const hrs=Array(24).fill(0);L.forEach(q=>{hrs[new Date(q.pub.getTime()+5.5*36e5).getUTCHours()]++});const pk=hrs.indexOf(Math.max(...hrs));const hh=h=>String(h%24).padStart(2,'0')+':00';
   let best=null;if(cn&&cn.online){let bv=-1;cn.online.forEach(r=>r.forEach((v,h)=>{if(v>bv){bv=v;best=h}}))}
   return bars(hrs,{h:96,labels:['0h','6h','12h','18h','23h'],xl:hrs.map((_,i)=>hh(i)+' to '+hh(i+1)+' IST'),fmt:v=>v+(v===1?' post':' posts')})+`<div class="hint">Your last ${L.length} posts by hour, IST. Most land between ${hh(pk)} and ${hh(pk+1)}${best!=null?`; your audience's strongest hour starts at ${hh(best)}`:''}.</div>`})()}</section>`}
  else if(p==='yt'){body=banner('YouTube reports nothing about when your audience is online. What follows is built from your own uploads, not from viewers — a weaker signal, labelled as one.','amber')+
   `<section class="block">${titleRow('Your best publish days',KM.srcK())}${rankbars([['Saturday',1.31],['Thursday',1.12],['Sunday',1.04],['Tuesday',0.96],['Wednesday',0.91],['Friday',0.88],['Monday',0.79]],{fmt:v=>fmt.x(v)})}
    <div class="hint">Day-7 engaged views by publish day, as a multiple of your typical. 12 months, 104 videos.</div>
    ${readN('Saturday uploads finish day 7 at 1.31× your typical; Monday at 0.79×. Over a year of uploads that gap is real, but it is your history, not a law — start there and watch the next four.','small')}
    ${explain('publish-days','When your own videos have historically done best in their first week.','YouTube doesn\'t tell us when your audience is online, so this comes from your posts, not theirs.','Treat it as a starting point, not a rule.')}</section>
   <section class="block">${titleRow('Best publish hour',KM.srcK())}${rankbars([['6–8pm',1.22],['12–2pm',1.08],['8–10pm',1.01],['9–11am',0.9],['other',0.82]],{fmt:v=>fmt.x(v)})}<div class="hint">Same method, by hour band, IST.</div></section>`}
  else body=`<div class="empty"><h2>Nothing to show yet</h2><p>Threads reports no audience-online data, and your posting history here is six weeks. Best days appear at twelve.</p></div>`}
 return topBar()+`<div class="title-row"><h1>Content</h1><span class="subtle">${posts.filter(q=>q.type!=='story').length} posts</span></div>`+seg('content',[['posts','Posts'],['formats','Formats'],['times',p==='ig'?'Times':'Best days']])+body}

 const typical=t=>{const pool=c.posts.filter(q=>q.id!==p.id&&q.pf===p.pf&&q.type===p.type&&q.mature).slice(0,20);return pool.length>=5?F.median(pool.map(q=>q.curve(t))):null};
 const typHourly=(()=>{const pool=c.posts.filter(q=>q.id!==p.id&&q.pf===p.pf&&q.type===p.type&&q.mature).slice(0,20);return pool.length<5?null:Array.from({length:49},(_,h)=>F.median(pool.map(q=>q.hourly[h])))})();

 let body='';

  body=`<section class="block"><h2>${p.title}</h2><div class="meta">${fmt.date(p.pub)} · ${f.length} frames · captured at ${p.captured}</div>

   <section class="block">${titleRow('Frame by frame',KM.src('ig'))}${funnel(f)}
    ${readN(`${fmt.pct(kept,0)} of the ${fmt.n(f[0].views)} who opened frame 1 reached the end. Frame ${worst[0]+1} lost the most — ${fmt.pct(worst[1],0)} exited there.${backI>0?` People tapped back on frame ${backI+1}: that's the one they wanted to see again, so put it earlier.`:''}`)}
    ${explain('story','Per story frame: how many kept going, went back, or left.','Exits show the frame that lost them; tap-backs show the frame they wanted twice.','Move what people tap back on earlier in the set.')}</section>

    <div class="hint">Stories never enter engagement rate, viral score or cohort comparisons — they're 24-hour objects with their own rules.</div></section>`}
 else if(p.type==='live'){const L=p.live;
  body=`<section class="block"><h2>${p.title}</h2><div class="meta">${fmt.date(p.pub)} · ${L.mins} minutes live</div></section>
